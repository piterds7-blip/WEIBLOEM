<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weibloem — żywienie stada</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#24493a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weibloem">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --tlo:#E6EAE5; --pow:#FAFBF8; --pow2:#F1F4F0; --tusz:#1C2924; --tusz2:#56645D; --linia:#C8D0C9;
  --gl:#24493A; --gl2:#3F7A57; --gl3:#DCE9DF;
  --obj:#6E8B33; --tres:#C9862A; --dod:#4A68A0; --nd:#8A6A3E;
  --ok:#2E7D4F; --zolty:#B8901C; --zly:#B23A2E;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-w:'Barlow Condensed','Arial Narrow',var(--font);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
body{background:var(--tlo);color:var(--tusz);font:15px/1.4 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gl2);outline-offset:2px}

/* ===== NAGŁÓWEK ===== */
header{background:var(--gl);color:#EEF3EE;position:sticky;top:0;z-index:50}
.gora{display:flex;align-items:center;gap:14px;padding:10px 18px 4px;max-width:1560px;margin:0 auto}
.marka{display:flex;align-items:baseline;gap:10px}
.marka b{font:700 24px/1 var(--font-w);letter-spacing:.5px}
.marka span{font-size:13px;opacity:.75}
.firma-nag{font-size:13px;opacity:.8;margin-left:auto;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
#sync{font-size:12.5px;padding:4px 10px;border-radius:20px;background:rgba(255,255,255,.12);white-space:nowrap;cursor:default}
#sync.ok::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#7FD69B;margin-right:6px}
#sync.zapis{background:rgba(232,190,90,.28)}
#sync.offline,#sync.blad{background:rgba(214,92,77,.4)}
nav#zakladki{display:flex;gap:2px;padding:6px 14px 0;max-width:1560px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
nav#zakladki::-webkit-scrollbar{display:none}
nav#zakladki button{border:0;background:transparent;color:#D6E2D9;padding:8px 14px 9px;border-radius:8px 8px 0 0;cursor:pointer;font-weight:600;white-space:nowrap}
nav#zakladki button:hover{background:rgba(255,255,255,.08)}
nav#zakladki button.akt{background:var(--tlo);color:var(--tusz)}

main{max-width:1560px;margin:0 auto;padding:16px 18px 60px}

/* ===== ELEMENTY OGÓLNE ===== */
.panel{background:var(--pow);border:1px solid var(--linia);border-radius:8px;margin-bottom:16px}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--linia)}
.ph h2{font:600 19px/1.2 var(--font-w);margin:0;letter-spacing:.2px}
.ph .opis{color:var(--tusz2);font-size:13px}
.ph .prawo{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pb{padding:12px 14px}
.przewin{overflow-x:auto}
.btn{border:1px solid var(--linia);background:var(--pow);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--pow2)}
.btn.glowny{background:var(--gl);border-color:var(--gl);color:#fff}
.btn.glowny:hover{background:var(--gl2)}
.btn.maly{padding:3px 8px;font-size:13px}
.btn.ikona{padding:2px 7px;font-size:13px;line-height:1.3}
.btn.usun{color:var(--zly)}
.btn.usun:hover{background:#F8E6E3}
.btn:disabled{opacity:.45;cursor:default}
.pole{border:1px solid var(--linia);border-radius:4px;padding:5px 7px;background:#fff;min-width:0}
.pole:focus{border-color:var(--gl2);outline:none;box-shadow:0 0 0 2px var(--gl3)}
.pole.num{text-align:right;width:84px}
.pole.krotkie{width:62px}
.pole.szer{width:100%}
select.pole{padding:4px 6px}
textarea.pole{resize:vertical;min-height:34px;width:100%}
label.et{display:block;font-size:12.5px;color:var(--tusz2);margin-bottom:3px;font-weight:600}
.wiersz{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.wiersz>div{flex:1;min-width:140px}
.cichy{color:var(--tusz2);font-size:13px}
.ostrz{color:var(--zly);font-weight:600}
.dobry{color:var(--ok);font-weight:600}
.znacznik{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--pow2);border:1px solid var(--linia);color:var(--tusz2);white-space:nowrap}
.kat-kropka{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.pusto{padding:28px 16px;text-align:center;color:var(--tusz2)}
.pusto b{display:block;color:var(--tusz);font-size:16px;margin-bottom:4px}
.baner{padding:9px 14px;border-radius:6px;margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.baner.info{background:#E3ECF3;border:1px solid #B8CBDA}
.baner.uwaga{background:#FBF1DA;border:1px solid #E5CF92}

/* ===== TABELE ===== */
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{font-weight:600;font-size:12.5px;color:var(--tusz2);text-align:right;padding:7px 8px;border-bottom:2px solid var(--linia);background:var(--pow);vertical-align:bottom;white-space:nowrap}
table.t td{padding:5px 8px;border-bottom:1px solid #E2E7E2;text-align:right;vertical-align:middle}
table.t th.l,table.t td.l{text-align:left}
table.t tr.kat td{background:var(--pow2);font-weight:700;text-align:left;font-family:var(--font-w);font-size:15px;letter-spacing:.2px}
table.t tr.suma td{font-weight:700;border-top:2px solid var(--linia);background:#F4F7F3}
table.t tr.pod td{font-weight:600;background:#F7F9F6}
table.t tbody tr:hover td{background:#F5F8F4}
table.t tr.kat:hover td{background:var(--pow2)}
.nazwa-sur{display:flex;align-items:center;gap:6px;white-space:nowrap}
.strz{display:inline-flex;flex-direction:column;line-height:.8}
.strz button{border:0;background:none;cursor:pointer;font-size:10px;padding:1px 3px;color:var(--tusz2)}
.strz button:disabled{opacity:.2;cursor:default}

/* ===== RECEPTURY ===== */
table.rec td.kom{padding:3px 5px;position:relative}
table.rec .pole.num{width:72px}
table.rec th.rk{text-align:center;min-width:118px;vertical-align:top;padding:8px 6px}
.rk-nazwa{font:600 16px/1.15 var(--font-w);color:var(--tusz);cursor:pointer}
.rk-nazwa:hover{text-decoration:underline}
.rk-grupy{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;margin:5px 0}
.rk-grupy span{font-size:11px;padding:0 5px;border-radius:3px;color:#fff;font-weight:600}
.rk-akcje{display:flex;gap:3px;justify-content:center}
.nr-mini{position:absolute;left:2px;top:2px;font-size:10px;font-weight:700;color:var(--gl2)}
th.rk.numerowanie,td.kom.numerowanie{background:#EEF5EF}
button.nr{width:30px;height:30px;border-radius:50%;border:2px dashed var(--gl2);background:#fff;color:var(--gl2);font-weight:700;cursor:pointer;font-size:14px;transition:transform .15s}
button.nr:hover{transform:scale(1.1)}
button.nr.ma{border-style:solid;background:var(--gl);border-color:var(--gl);color:#fff}
.nr-kg{font-size:12px;color:var(--tusz2);margin-left:6px}
.pasek-num{position:sticky;top:calc(var(--hdr,92px) + 6px);z-index:20;background:var(--gl);color:#fff;border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 18px rgba(20,40,30,.25)}
.pasek-num .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff}
.pasek-num .btn:hover{background:rgba(255,255,255,.2)}
.pasek-num select{color:var(--tusz)}

/* ===== GRUPY ===== */
.grupa{display:grid;grid-template-columns:8px 1fr;border-bottom:1px solid var(--linia)}
.grupa:last-child{border-bottom:0}
.grupa .kol{cursor:pointer}
.grupa .tresc{padding:10px 14px;display:grid;grid-template-columns:minmax(220px,1.1fr) minmax(260px,1.5fr) minmax(200px,.9fr);gap:12px 20px}
@media(max-width:1000px){.grupa .tresc{grid-template-columns:1fr}}
.g-gora{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g-gora .pole.nazwa{font-weight:700;width:130px}
.przel{display:inline-flex;border:1px solid var(--linia);border-radius:6px;overflow:hidden}
.przel button{border:0;background:#fff;padding:4px 10px;cursor:pointer;font-weight:600;font-size:13px}
.przel button.akt{background:var(--gl);color:#fff}
.sektory{display:flex;flex-wrap:wrap;gap:6px}
.sektor-ed{display:flex;align-items:center;gap:4px;background:var(--pow2);border:1px solid var(--linia);border-radius:6px;padding:3px 4px 3px 8px}
.sektor-ed .pole{padding:3px 5px}
.liczby-g{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:13.5px;align-content:start}
.liczby-g b{text-align:right}

/* ===== WÓZ PASZOWY ===== */
.woz-gora{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.dzien-nav{display:flex;align-items:center;gap:4px;background:var(--pow);border:1px solid var(--linia);border-radius:8px;padding:4px}
.dzien-nav .pole{border:0;font-weight:600}
.dzien-tyt{font:600 22px/1 var(--font-w);margin-right:6px}
.woz-uklad{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}
.woz-uklad>*{min-width:0}
@media(max-width:920px){.woz-uklad{grid-template-columns:minmax(0,1fr)}}
.boczny{position:sticky;top:calc(var(--hdr,92px) + 10px);max-height:calc(100vh - var(--hdr,92px) - 20px);overflow:auto;padding-right:2px}
.opis-boczny{font-size:12.5px;margin-bottom:6px}
.nd-tyt{margin-top:16px!important}
@media(max-width:920px){
  .boczny{top:var(--hdr,92px);z-index:30;background:var(--tlo);max-height:none;overflow:visible;margin:0 -10px;padding:6px 10px 8px;border-bottom:1px solid var(--linia);box-shadow:0 6px 12px -8px rgba(20,40,30,.35)}
  .boczny h3{font-size:15px;margin:2px 0 4px}.nd-tyt{margin-top:6px!important}
  .opis-boczny,.boczny .grupa-et{display:none}
  .lista-sek{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .lista-sek .chip{min-width:178px;margin:0;flex:0 0 auto}
  .lista-sek .chip.nd{min-width:290px}
  .lista-sek .pusto{padding:6px}
}
.boczny h3{font:600 17px var(--font-w);margin:4px 0 6px;display:flex;align-items:center;gap:6px}
.grupa-et{font-size:12px;font-weight:700;color:var(--tusz2);margin:10px 0 3px;display:flex;align-items:center;gap:6px}
.grupa-et i{width:12px;height:12px;border-radius:3px;display:inline-block}
.chip{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;background:var(--pow);border:1px solid var(--linia);border-left-width:6px;border-radius:6px;padding:6px 8px;margin-bottom:5px;cursor:grab;user-select:none;-webkit-user-select:none;transition:transform .12s,box-shadow .12s}
.chip:hover{box-shadow:0 2px 8px rgba(30,50,40,.12)}
.chip .uchwyt{grid-row:span 2;color:var(--tusz2);font-size:15px;letter-spacing:-2px;padding:6px 2px;touch-action:none;cursor:grab}
.chip .n{font-weight:700;font-size:14.5px}
.chip .s{font-size:12.5px;color:var(--tusz2);text-align:right}
.chip .post{grid-column:2/4;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tusz2)}
.post-bar{flex:1;height:5px;border-radius:3px;background:#E1E6E1;overflow:hidden}
.post-bar i{display:block;height:100%;background:var(--gl2);transition:width .35s}
.chip.pelny .post-bar i{background:var(--ok)}
.chip.pelny .n::after{content:' ✓';color:var(--ok)}
.chip.nd{border-left-color:var(--nd);background:repeating-linear-gradient(135deg,#FBF7EF 0 8px,#F6EEDD 8px 16px)}
.kursy-kol{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:16px;align-items:start}
@media(max-width:520px){.kursy-kol{grid-template-columns:1fr}}
.zad-tyt{font:600 20px var(--font-w);margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.zad-tyt small{font:500 13px var(--font);color:var(--tusz2)}
.kurs{background:var(--pow);border:1px solid var(--linia);border-radius:10px;margin-bottom:14px;overflow:hidden;animation:wjazd .28s ease-out}
.kurs-pas{height:6px}
.kurs-nag{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;flex-wrap:wrap}
.kurs-nr{font:700 21px/1 var(--font-w);white-space:nowrap}
.kurs-nag .uchwyt{cursor:grab;color:var(--tusz2);padding:4px;touch-action:none;font-size:16px;letter-spacing:-2px}
.kurs-nag select{max-width:190px}
.kurs-nag .prawo{margin-left:auto;display:flex;gap:4px}
.wanna-wrap{padding:2px 10px 4px}
.wanna{position:relative;height:38px;border-radius:3px 3px 16px 16px;background:#E2E7E1;box-shadow:inset 0 2px 4px rgba(0,0,0,.12);overflow:hidden;display:flex}
.wanna .seg{height:100%;display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px var(--font-w);overflow:hidden;transition:width .45s cubic-bezier(.2,.8,.2,1);border-right:1px solid rgba(255,255,255,.35);min-width:0}
.wanna .seg.nd{background:repeating-linear-gradient(45deg,#8A6A3E 0 6px,#AD8B5A 6px 12px)}
.wanna .poj{position:absolute;top:-2px;bottom:-2px;border-left:2px dashed var(--zly)}
.wanna.pusta::after{content:'Wóz pusty — przeciągnij tu sektor';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--tusz2);font-size:13px}
.wanna-opis{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--tusz2);padding:3px 2px 0;flex-wrap:wrap}
.wanna-opis b{color:var(--tusz)}
.kurs-wiersze{padding:4px 10px 6px}
.kw{display:grid;grid-template-columns:12px minmax(90px,1fr) 52px 74px 84px 60px 52px 26px;gap:6px;align-items:center;padding:5px 4px;border-bottom:1px solid #E6EBE6;font-size:13.5px;border-radius:4px}
.kw.nag{font-size:11.5px;color:var(--tusz2);font-weight:600;border-bottom:1px solid var(--linia)}
.kw.nag span{text-align:right}
.kw .r{text-align:right}
.kw .dot{width:10px;height:10px;border-radius:50%}
.kw .pole.num{width:100%;padding:3px 5px}
.kw.ndw{background:repeating-linear-gradient(135deg,#FBF7EF 0 8px,#F6EEDD 8px 16px)}
@media(max-width:520px){.kw{grid-template-columns:10px minmax(0,1fr) 72px 40px 46px 26px;gap:5px}.kw .ukr{display:none}.kurs-nag select{flex:1;min-width:0;max-width:none}.kurs-nag .prawo{margin-left:0}}
.proc{font-weight:700;font-size:12px;text-align:center;border-radius:10px;padding:1px 0;color:#fff}
.proc.ok{background:var(--ok)}.proc.sr{background:var(--zolty)}.proc.zle{background:var(--zly)}
.upusc{margin:6px 10px 10px;border:2px dashed var(--linia);border-radius:8px;padding:9px;text-align:center;color:var(--tusz2);font-size:13px;transition:background .15s,border-color .15s}
.nowy-kurs{border:2px dashed var(--linia);border-radius:10px;padding:18px;text-align:center;color:var(--tusz2);margin-bottom:14px}
.nowy-kurs .btn{margin-top:6px}
.cel-ok{outline:3px dashed var(--gl2)!important;outline-offset:2px;background-color:#EEF6EF!important}
.upusc.cel-ok,.nowy-kurs.cel-ok{border-color:var(--gl2);color:var(--gl)}
.duch{position:fixed;z-index:1000;pointer-events:none;opacity:.93;transform:rotate(-2deg) scale(1.03);box-shadow:0 12px 28px rgba(20,40,30,.3);width:260px}
.przeciagany{opacity:.35}
.wpada{animation:wpada 1s ease-out}
.odrzut{animation:odrzut .4s}
@keyframes wpada{0%{background:#FCE7A6}100%{background:transparent}}
@keyframes odrzut{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes wjazd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--tusz2);margin:4px 0 10px}
.legenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.nd-info{font-size:12px;color:var(--tusz2);grid-column:2/4}
.nd-info .pole{width:70px;padding:2px 5px}

/* ===== MODAL I TOAST ===== */
#modal{position:fixed;inset:0;background:rgba(20,32,26,.45);display:none;align-items:flex-start;justify-content:center;z-index:900;padding:8vh 12px 12px;overflow:auto}
#modal.otw{display:flex}
.m-okno{background:var(--pow);border-radius:10px;max-width:520px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.3);animation:wjazd .2s}
.m-tyt{padding:14px 16px 10px;font:600 20px var(--font-w);border-bottom:1px solid var(--linia)}
.m-tresc{padding:14px 16px;display:grid;gap:12px}
.m-stopka{padding:10px 16px 14px;display:flex;justify-content:flex-end;gap:8px}
.lista-wyb{display:grid;gap:6px}
.lista-wyb button{text-align:left;border:1px solid var(--linia);background:#fff;border-radius:6px;padding:8px 10px;cursor:pointer}
.lista-wyb button:hover{background:var(--gl3)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--tusz);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;z-index:1000;max-width:min(560px,92vw);font-size:14px;pointer-events:none}
#toast.pok{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.zly{background:var(--zly)}
/* ===== LOGOWANIE, KONTO, UPRAWNIENIA ===== */
#logowanie{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--gl)}
.login-karta{background:var(--pow);border-radius:14px;width:100%;max-width:380px;padding:26px 24px 22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-karta img{width:84px;height:84px;border-radius:20px;display:block;margin:0 auto 10px}
.login-karta h1{font:700 30px/1 var(--font-w);text-align:center;margin:0}
.login-karta .pod-tyt{text-align:center;color:var(--tusz2);margin:4px 0 18px;font-size:14px}
.login-karta form{display:grid;gap:12px}
.login-karta .pole{padding:10px 12px;font-size:16px}
.login-karta .btn.glowny{padding:11px;font-size:16px}
.login-blad{background:#F8E6E3;color:var(--zly);border-radius:6px;padding:8px 10px;font-size:14px}
#konto{border:0;background:rgba(255,255,255,.12);color:#EEF3EE;border-radius:20px;padding:4px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
#konto:hover{background:rgba(255,255,255,.22)}
.pole:disabled,select.pole:disabled,textarea.pole:disabled{background:transparent;border-color:transparent;color:inherit;opacity:1;-webkit-appearance:none;appearance:none;cursor:default}
.ukryj-ro{display:none!important}
.baner.tryb{background:#EDEFF6;border:1px solid #C7CDE2}

<body>
<header>
  <div class="gora">
    <div class="marka"><b>Weibloem</b><span>żywienie stada</span></div>

<div id="logowanie" hidden></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<script>
'use strict';
/* =====================================================================
   1. KONFIGURACJA
   ===================================================================== */
// Konfiguracja Firebase jest w osobnym pliku firebase-config.js (window.FIREBASE_CONFIG),
// żeby podmiana index.html przy aktualizacji jej nie kasowała. Brak pliku = tryb lokalny bez logowania.
const FB_CONFIG = window.FIREBASE_CONFIG || null;
const KOL_UZYT  = 'weibloem_uzytkownicy'; // jeden dokument = jedno konto (id = uid z Firebase Auth)
const KOL_ADMIN = 'weibloem_admin';       // 'init' (pierwszy twórca utworzony), 'uprawnienia' (macierz ról)
const KOL_MODULY = 'weibloem_moduly';  // kolekcja: jeden dokument = jeden moduł
const KOL_DNI    = 'weibloem_dni';     // kolekcja: jeden dokument = jeden dzień żywienia (id RRRR-MM-DD)
const WERSJA_DANYCH = 1;               // sufiks kluczy localStorage; zmiana struktury = +1 i wpis w MIGRACJE
const DEBOUNCE_MS = 800;
const DNI_WSTECZ = 60;                 // ile dni wstecz nasłuchujemy na żywo
const DNI_STANY_MAX = 180;             // najdalej wstecz liczymy zużycie do stanów
const MIESIAC_DNI = 30;
const MODULY = ['surowce','receptury','grupy','wozy','ustawienia','suchytmr'];

/* =====================================================================
   2. NARZĘDZIA
   ===================================================================== */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];

// Jedyna funkcja parsująca liczby w aplikacji – przecinek dziesiętny, spacje tysięcy
function parseFloatPL(v){
  if(v==null) return NaN;
  if(typeof v==='number') return v;
  const s=String(v).trim().replace(/[\s\u00a0]/g,'').replace(',','.');
  if(s==='') return NaN;
  return parseFloat(s);
}
function liczba(v,dom=0){ const n=parseFloatPL(v); return Number.isFinite(n)?n:dom; }
const _nf={};
function fmt(n,min=0,max){
  if(n==null||!Number.isFinite(n)) return '–';
  max=max??min; const k=min+'_'+max; const p=10**max; n=Math.round((n+Math.sign(n)*1e-9)*p)/p;  // korekta błędu zmiennoprzecinkowego (28,355 → 28,36)
  if(!_nf[k]) _nf[k]=new Intl.NumberFormat('pl-PL',{minimumFractionDigits:min,maximumFractionDigits:max});
  return _nf[k].format(n).replace(/\u00a0/g,' ');
}
function fmtIn(n,max=3){ if(n==null||n===''||!Number.isFinite(+n)) return ''; const p=10**max; return String(Math.round(n*p)/p).replace('.',','); }
function cenaKg(cenaT){ return fmt((cenaT||0)/1000,2,3); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(p='x'){ return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function isoData(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dzis(){ return isoData(new Date()); }
function dataPlus(iso,n){ const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return isoData(d); }
function roznicaDni(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5); }
function dataPL(iso){ if(!iso) return '–'; const [y,m,d]=iso.split('-'); return d+'.'+m+'.'+y; }
const DNI_TYG=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
function dzienTyg(iso){ return DNI_TYG[new Date(iso+'T12:00:00').getDay()]; }
function klon(o){ return o===undefined?null:JSON.parse(JSON.stringify(o)); }
function stabilny(o){ // JSON niezależny od kolejności kluczy (Firestore nie zachowuje kolejności pól)
  if(Array.isArray(o)) return '['+o.map(stabilny).join(',')+']';
  if(o&&typeof o==='object') return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stabilny(o[k])).join(',')+'}';
  return JSON.stringify(o);
}
let _tt;
function toast(t,typ){ const e=$('#toast'); e.textContent=t; e.className='pok'+(typ?' '+typ:''); clearTimeout(_tt); _tt=setTimeout(()=>e.className='',typ==='zly'?4200:2600); }

const KAT={obj:'Pasze objętościowe',tres:'Pasze treściwe',dod:'Dodatki paszowe'};
const KAT_KR={obj:'Objętościowa',tres:'Treściwa',dod:'Dodatek'};
const KAT_KOL={obj:'#6E8B33',tres:'#C9862A',dod:'#4A68A0'};
const KAT_ODC={obj:['#6E8B33','#87A447','#5A7428'],tres:['#C9862A','#DDA24B','#AE7020'],dod:['#4A68A0','#6685BE','#3A5688']};
const KOLORY_GRUP=['#3E7C59','#C0773A','#3D6FA3','#A2475E','#7A5BA6','#2E8C8C','#A68B22','#6D7F3A','#A85C3C','#4F5D75','#B05A8C','#5C8A2E'];

/* =====================================================================
   3. PAMIĘĆ LOKALNA + MIGRACJE (klucze z sufiksem wersji)
   ===================================================================== */
const LS='wb_v'+WERSJA_DANYCH+':';
function lsCzytaj(k){ try{ const v=localStorage.getItem(LS+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lsZapisz(k,v){ try{ localStorage.setItem(LS+k,JSON.stringify(v)); }catch(e){ console.warn(e); toast('Pamięć lokalna pełna – zmiany idą tylko do chmury','zly'); } }
// MIGRACJE[n] = funkcja(mapa) przekształcająca dane z wersji n-1 do n.
// Mapa ma postać {klucz: wartość}, np. {'m:surowce':{d,ts,niezsync}, 'd:2026-10-05':{...}}.
// Stary klucz zostaje nietknięty – migracja zapisuje do nowego.
const MIGRACJE={
  // 2: mapa => { ...przekształcenie... ; return mapa; }
};
function migrujPamiec(){
  const klucze=Object.keys(localStorage);
  if(klucze.some(k=>k.startsWith(LS))) return;
  for(let v=WERSJA_DANYCH-1; v>=1; v--){
    const pref='wb_v'+v+':';
    const stare=klucze.filter(k=>k.startsWith(pref));
    if(!stare.length) continue;
    let mapa={};
    stare.forEach(k=>{ try{ mapa[k.slice(pref.length)]=JSON.parse(localStorage.getItem(k)); }catch(e){} });
    for(let n=v+1; n<=WERSJA_DANYCH; n++){ if(MIGRACJE[n]) mapa=MIGRACJE[n](mapa); }
    Object.entries(mapa).forEach(([k,w])=>lsZapisz(k,w));
    console.info('Migracja danych lokalnych v'+v+' → v'+WERSJA_DANYCH);
    return;
  }
}

/* =====================================================================
   4. SYNCHRONIZACJA – chirurgiczna, jednostka = moduł albo dzień
   ===================================================================== */
const DEV=(()=>{ let d=localStorage.getItem('wb_urzadzenie'); if(!d){ d=uid('u'); localStorage.setItem('wb_urzadzenie',d); } return d; })();
let fs=null, syncBlad=false;
const J={};          // klucz ('m:surowce' | 'd:2026-10-05') → jednostka synchronizacji
let wersja=0;        // licznik zmian – unieważnia pamięć podręczną obliczeń

function jednostka(klucz,opcje){
  if(J[klucz]) return J[klucz];
  const zap=lsCzytaj(klucz);
  const u=J[klucz]={klucz,...opcje,ts:zap?.ts||0,niezsync:!!zap?.niezsync,pierwszy:false,timer:null,wyslanyTs:0,wTrakcie:false,zSeedu:false};
  if(zap && zap.d!=null) u.ustaw(zap.d);
  return u;
}
function zapiszLokalnie(u){ lsZapisz(u.klucz,{d:u.pobierz(),ts:u.ts,niezsync:u.niezsync}); }

// Wywoływane po każdej lokalnej edycji – zapis lokalny od razu, do chmury z opóźnieniem
function oznaczZmiane(klucz){
  const u=J[klucz]; if(!u) return;
  wersja++;
  u.ts=Date.now(); u.niezsync=true; zapiszLokalnie(u);
  clearTimeout(u.timer); u.timer=setTimeout(()=>wypchnij(klucz),DEBOUNCE_MS);
  pokazSync();
}
function wypchnij(klucz){
  const u=J[klucz]; if(!u) return;
  clearTimeout(u.timer); u.timer=null;
  if(!fs || !u.pierwszy){ pokazSync(); return; }   // czekamy na pierwszy snapshot – nie nadpisujemy chmury starym cache
  const dane=u.pobierz(); if(dane==null){ pokazSync(); return; }
  const ts=u.ts; u.wyslanyTs=ts; u.wTrakcie=true; pokazSync();
  u.ref().set({d:klon(dane),_ts:ts,_dev:DEV,_v:WERSJA_DANYCH})
    .then(()=>{ u.wTrakcie=false; if(u.ts===ts && !u.timer){ u.niezsync=false; zapiszLokalnie(u); } syncBlad=false; pokazSync(); })
    .catch(e=>{
      u.wTrakcie=false; console.warn('Zapis '+klucz,e);
      if(e && e.code==='permission-denied'){
        // rola nie może zapisywać tego modułu – cofamy lokalną zmianę do stanu z chmury
        toast('Brak uprawnień do zapisu ('+klucz.replace(/^m:|^d:/,'')+') – przywrócono dane z chmury','zly');
        u.niezsync=false; u.zSeedu=false;
        u.ref().get().then(s=>{ if(s.exists){ const r=s.data(); u.ustaw(r.d); u.ts=r._ts||0; } zapiszLokalnie(u); wersja++; pokazSync(); odswiezZdalnie(); }).catch(()=>{});
        return;
      }
      syncBlad=true; pokazSync();
    });
}
function saveModule(nazwa){ oznaczZmiane('m:'+nazwa); if(nazwa==='receptury'||nazwa==='grupy'||nazwa==='surowce') przeliczDniPoDawkach(); }
function saveDzien(data){ jednostkaDnia(data); oznaczZmiane('d:'+data); }

function przyjmijSnapshot(klucz,snap){
  const u=J[klucz]; if(!u) return;
  if(snap.metadata && snap.metadata.hasPendingWrites) return;      // echo własnego zapisu
  const pierwszy=!u.pierwszy; u.pierwszy=true;
  if(!snap.exists){
    // brak dokumentu w chmurze: jednorazowy seed z tego urządzenia (tylko ten moduł/dzień)
    if(pierwszy && (u.niezsync || u.zSeedu)) wypchnij(klucz);
    pokazSync(); return;
  }
  const r=snap.data()||{};
  if(r._dev===DEV && r._ts===u.wyslanyTs){ pokazSync(); return; }  // potwierdzenie własnego zapisu
  if(u.timer || u.wTrakcie){ pokazSync(); return; }                  // lokalna zmiana w drodze – zostanie wysłana
  if(u.niezsync && u.ts>(r._ts||0)){ wypchnij(klucz); return; }       // edycje offline nowsze niż chmura
  u.ustaw(r.d); u.ts=r._ts||0; u.niezsync=false; u.zSeedu=false; zapiszLokalnie(u);
  wersja++; pokazSync(); odswiezZdalnie();
}

let syncUruchomiony=false;
function startSync(){
  if(!fs || syncUruchomiony){ pokazSync(); return; }
  syncUruchomiony=true;
  MODULY.forEach(m=>{
    const k='m:'+m;
    fs.collection(KOL_MODULY).doc(m).onSnapshot(s=>przyjmijSnapshot(k,s),e=>{ console.warn(k,e); syncBlad=true; pokazSync(); });
  });
  podlaczDni();
  addEventListener('online',ponowWysylke);
  pokazSync();
}
function ponowWysylke(){ Object.values(J).forEach(u=>{ if(u.niezsync && !u.timer && !u.wTrakcie) wypchnij(u.klucz); }); pokazSync(); }
function wypchnijOczekujace(){ Object.values(J).forEach(u=>{ if(u.timer) wypchnij(u.klucz); }); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') wypchnijOczekujace(); });
addEventListener('pagehide',wypchnijOczekujace);
addEventListener('offline',()=>pokazSync());

/* --- dni: jeden nasłuch zakresu + pojedyncze dla starszych dat --- */
let odDniaNasluch=null, dniGotowe=false;
const nasluchPojedynczy={};
function najstarszyPotrzebnyDzien(){
  let od=dataPlus(dzis(),-DNI_WSTECZ);
  const granica=dataPlus(dzis(),-DNI_STANY_MAX);
  D.surowce.forEach(s=>{ if(s.stanData && s.stanData<od) od=s.stanData; });
  Object.values(J).forEach(u=>{ if(u.klucz.startsWith('d:') && u.niezsync && u.klucz.slice(2)<od) od=u.klucz.slice(2); });
  return od<granica?granica:od;
}
function podlaczDni(){
  odDniaNasluch=najstarszyPotrzebnyDzien();
  fs.collection(KOL_DNI).where(firebase.firestore.FieldPath.documentId(),'>=',odDniaNasluch).onSnapshot(qs=>{
    qs.docChanges().forEach(ch=>{ if(ch.type==='removed') return; jednostkaDnia(ch.doc.id); przyjmijSnapshot('d:'+ch.doc.id,ch.doc); });
    if(!dniGotowe){
      dniGotowe=true;
      Object.values(J).forEach(u=>{
        if(!u.klucz.startsWith('d:') || u.pierwszy) return;
        if(u.klucz.slice(2)>=odDniaNasluch){ u.pierwszy=true; if(u.niezsync) wypchnij(u.klucz); }
      });
    }
    pokazSync();
  },e=>{ console.warn('dni',e); syncBlad=true; pokazSync(); });
}
function jednostkaDnia(data){
  const k='d:'+data;
  if(J[k]) return J[k];
  const u=jednostka(k,{ref:()=>fs.collection(KOL_DNI).doc(data),pobierz:()=>DNI[data]??null,ustaw:d=>{ DNI[data]=normalizujDzien(d,data); }});
  if(fs){
    if(odDniaNasluch && data>=odDniaNasluch){ if(dniGotowe) u.pierwszy=true; }
    else if(odDniaNasluch && !nasluchPojedynczy[data]){
      nasluchPojedynczy[data]=fs.collection(KOL_DNI).doc(data).onSnapshot(s=>przyjmijSnapshot(k,s),e=>console.warn(k,e));
    }
  }
  return u;
}

function pokazSync(){
  const e=$('#sync'); if(!e) return;
  const lista=Object.values(J);
  let kl='', t='';
  if(!FB_CONFIG || typeof firebase==='undefined'){ kl='offline'; t=FB_CONFIG?'Brak SDK Firebase – zapis lokalny':'Tylko to urządzenie'; }
  else if(!fs){ kl='blad'; t='Błąd połączenia z Firebase'; }
  else if(!navigator.onLine){ kl='offline'; t='Offline – zapis lokalny'; }
  else if(MODULY.some(m=>!J['m:'+m]?.pierwszy) || !dniGotowe){ kl='zapis'; t='Łączenie…'; }
  else if(lista.some(u=>u.timer||u.wTrakcie)){ kl='zapis'; t='Zapisywanie…'; }
  else if(syncBlad){ kl='blad'; t='Błąd zapisu – ponowię'; }
  else if(lista.some(u=>u.niezsync)){ kl='zapis'; t='Oczekuje na wysłanie'; }
  else { kl='ok'; t='Zsynchronizowano'; }
  e.className=kl; e.textContent=t;
}

/* =====================================================================
   5. DANE STARTOWE (z raportu kosztów Weibloem 07.07.2026)
   ===================================================================== */
const SEED={
  surowce:[
    {id:'trawa', nazwa:'Trawa kiszonka',           kat:'obj', cenaT:135},
    {id:'kuk',   nazwa:'Kiszonka z kukurydzy',     kat:'obj', cenaT:190},
    {id:'sloma', nazwa:'Słoma pszenna',            kat:'obj', cenaT:250},
    {id:'pulpa', nazwa:'Pulpa kukurydziano-żytnia',kat:'tres',cenaT:290},
    {id:'rzep',  nazwa:'Śruta rzepakowa',          kat:'tres',cenaT:1400},
    {id:'soja',  nazwa:'Śruta sojowa',             kat:'tres',cenaT:1720},
    {id:'zboz',  nazwa:'Śruta zbożowa',            kat:'tres',cenaT:800},

function normalizujModul(m,d){
  if(m==='ustawienia') return (d&&typeof d==='object'&&!Array.isArray(d))?d:{};
  if(m==='suchytmr'){ const o=(d&&typeof d==='object'&&!Array.isArray(d))?d:{}; o.receptura=Array.isArray(o.receptura)?o.receptura:[]; o.partie=Array.isArray(o.partie)?o.partie:[]; o.partie.forEach(p=>{ p.sklad=Array.isArray(p.sklad)?p.sklad:[]; }); o.domyslnieKg=o.domyslnieKg||3500; return o; }
  const a=Array.isArray(d)?d:[];
  if(m==='surowce') a.forEach(s=>{ s.dostawy=s.dostawy||[]; s.kat=s.kat||'obj'; });
  if(m==='receptury') a.forEach(r=>{ r.sk=r.sk||[]; r.kolejnosc=r.kolejnosc||[]; });
  if(m==='grupy') a.forEach(g=>{ g.sektory=g.sektory||[]; g.zadania=g.zadania||1; });
  return a;
}
function normalizujDzien(d,data){
  d=(d&&typeof d==='object')?d:{};
  d.data=data; d.kursy=Array.isArray(d.kursy)?d.kursy:[]; d.niedojady=Array.isArray(d.niedojady)?d.niedojady:[];
  d.kursy.forEach(k=>{ k.rozdzial=Array.isArray(k.rozdzial)?k.rozdzial:[]; k.zadanie=k.zadanie||1; });
  d.niedojady.forEach(n=>{ n.alok=Array.isArray(n.alok)?n.alok:[]; });
  d.uwagi=d.uwagi||''; d.snap=d.snap||null;
  return d;
}

    if(!lsCzytaj('m:'+m)){

const surowiec=id=>D.surowce.find(s=>s.id===id);

// Kontekst = wszystko, co potrzebne do policzenia dnia. Dla dnia z wpisami jest zamrożony w dokumencie dnia.
let _kb=null,_kbW=-1;
function kontekstBiezacy(){
  if(_kbW===wersja && _kb) return _kb;
  const ceny={},sur={},receptury={},grupy={},sektory={};
  D.surowce.forEach((s,i)=>{ ceny[s.id]=s.cenaT||0; sur[s.id]={nazwa:s.nazwa,kat:s.kat,kolejnosc:i}; });
  D.receptury.forEach(r=>{ receptury[r.id]={nazwa:r.nazwa,sk:r.sk.filter(x=>x.kg>0).map(x=>({s:x.s,kg:x.kg}))}; });  // kolejność załadunku nie jest zamrażana – zawsze aktualna
  D.grupy.forEach((g,i)=>{
    grupy[g.id]={nazwa:g.nazwa,opis:g.opis||'',recepturaId:g.recepturaId||'',zadania:g.zadania||1,kolor:g.kolor||'#888',dojna:!!g.dojna,kolejnosc:i};
    (g.sektory||[]).forEach((s,j)=>{ sektory[s.id]={nazwa:s.nazwa,sztuki:s.sztuki||0,grupaId:g.id,kolejnosc:j}; if(s.wirt!=null&&s.wirt!=='') sektory[s.id].wirt=+s.wirt; });
  });
  _kb={ceny,sur,receptury,grupy,sektory}; _kbW=wersja;
  return _kb;
}
// Dziś i dni przyszłe liczą się zawsze z bieżących Dawek; dni minione – z kopii zamrożonej w dokumencie dnia.
function kontekst(data){ const d=DNI[data]; return (data<dzis() && d && d.snap)?d.snap:kontekstBiezacy(); }
// Wirtualne sztuki: na tyle sztuk liczy się dawkę sektora (puste = tyle co realnych)
function efSzt(s){ return s?((s.wirt!=null&&s.wirt!=='')?+s.wirt:(s.sztuki||0)):0; }
function snapRozni(data){ if(data>=dzis()) return false; const d=DNI[data]; if(!d||!d.snap) return false; const {ts,...s}=d.snap; return stabilny(s)!==stabilny(kontekstBiezacy()); }
function grupyC(C){ return Object.entries(C.grupy).map(([id,g])=>({id,...g})).sort((a,b)=>a.kolejnosc-b.kolejnosc); }
function sektoryGrupyC(C,gid){ return Object.entries(C.sektory).filter(([,s])=>s.grupaId===gid).map(([id,s])=>({id,...s})).sort((a,b)=>a.kolejnosc-b.kolejnosc); }
function surowceKolejnosc(C){ return Object.keys(C.sur).sort((a,b)=>{ const ia=D.surowce.findIndex(s=>s.id===a), ib=D.surowce.findIndex(s=>s.id===b); return (ia<0?999:ia)-(ib<0?999:ib); }); }

function statRec(C,rid){
  const r=C.receptury[rid];
  if(!r) return {kg:0,koszt:0,kosztKg:0,sk:[]};
  const kg=r.sk.reduce((a,x)=>a+x.kg,0);
  const koszt=r.sk.reduce((a,x)=>a+x.kg*(C.ceny[x.s]||0)/1000,0);
  return {kg,koszt,kosztKg:kg>0?koszt/kg:0,sk:r.sk};
}
function planSek(C,sid){ const s=C.sektory[sid]; if(!s) return 0; const g=C.grupy[s.grupaId]; return statRec(C,g?.recepturaId).kg*efSzt(s); }

// Kolejność załadunku: najpierw ponumerowane, potem pozostałe w kolejności bazy
function kolejnoscZaladunku(C,rid){
  const r=C.receptury[rid]; if(!r) return [];
  const obecne=r.sk.map(x=>x.s);
  const nr=(receptura(rid)?.kolejnosc||[]).filter(s=>obecne.includes(s));
  const reszta=surowceKolejnosc(C).filter(s=>obecne.includes(s)&&!nr.includes(s));
  return [...nr.map((s,i)=>({s,nr:i+1})),...reszta.map(s=>({s,nr:null}))];
}

/* Analiza dnia: trzy dawki per sektor + zużycie surowców i koszt (tylko świeża część).
   plan:true → ignoruje kursy, liczy wg dawki obliczonej. */
let _an={},_anW=-1;
function analizaDnia(data,opc={}){
  if(_anW!==wersja){ _an={}; _anW=wersja; }
  const klucz=data+(opc.plan?'|p':'');
  if(_an[klucz]) return _an[klucz];
  const C=kontekst(data), d=opc.plan?null:DNI[data], jutro=DNI[dataPlus(data,1)];
  const sek={}, zuz={};
  Object.entries(C.sektory).forEach(([id,s])=>{
    const g=C.grupy[s.grupaId]; const st=statRec(C,g?.recepturaId);
    sek[id]={id,...s,grupa:g,obl:s.sztuki>0?st.kg*efSzt(s)/s.sztuki:st.kg,planKg:st.kg*efSzt(s),swiezeKg:0,ndKg:0,maKurs:false,zPlanu:false,zebraneJutro:null,zuz:{},koszt:0};
  });
  const dodajZuz=(s,sid,kg)=>{ zuz[sid]=(zuz[sid]||0)+kg; if(s) s.zuz[sid]=(s.zuz[sid]||0)+kg; };
  (d?.kursy||[]).forEach(k=>{
    const st=statRec(C,k.recepturaId);
    k.rozdzial.forEach(r=>{
      const s=sek[r.sektorId], kg=r.kg||0;
      if(s){ s.swiezeKg+=kg; s.maKurs=true; s.koszt+=kg*st.kosztKg; }
      if(st.kg>0) st.sk.forEach(x=>dodajZuz(s,x.s,kg*x.kg/st.kg));
    });
  });
  (d?.niedojady||[]).forEach(n=>n.alok.forEach(a=>{ const s=sek[a.sektorId]; if(s) s.ndKg+=a.kg||0; }));
  Object.values(sek).forEach(s=>{
    if(!s.maKurs){
      s.zPlanu=true; s.swiezeKg=s.planKg;
      const st=statRec(C,s.grupa?.recepturaId); s.koszt=s.planKg*st.kosztKg;
      st.sk.forEach(x=>dodajZuz(s,x.s,efSzt(s)*x.kg));
    }
    s.zadanaKg=s.swiezeKg+s.ndKg;
    s.zadana=s.sztuki>0?s.zadanaKg/s.sztuki:0;
  });
  if(jutro && !opc.plan) jutro.niedojady.forEach(n=>{ const s=sek[n.sektorId]; if(s) s.zebraneJutro=(s.zebraneJutro||0)+(n.kg||0); });
  Object.values(sek).forEach(s=>{ s.pobrana=(jutro&&!opc.plan&&s.sztuki>0)?(s.zadanaKg-(s.zebraneJutro||0))/s.sztuki:null; });
  const wynik={data,C,d,sek,zuz};
  _an[klucz]=wynik;
  return wynik;
}
// Agregacja sektorów do grup
function grupyDnia(A){
  return grupyC(A.C).map(g=>{
    const ss=sektoryGrupyC(A.C,g.id).map(s=>A.sek[s.id]).filter(Boolean);
    const o={...g,sektory:ss,sztuki:0,efSzt:0,maWirt:false,planKg:0,swiezeKg:0,ndKg:0,zadanaKg:0,koszt:0,zuz:{},zPlanu:0,zebrane:0,pobranaOk:ss.length>0};
    ss.forEach(s=>{
      o.sztuki+=s.sztuki; o.efSzt+=efSzt(s); if(s.wirt!=null) o.maWirt=true; o.planKg+=s.planKg; o.swiezeKg+=s.swiezeKg; o.ndKg+=s.ndKg; o.zadanaKg+=s.zadanaKg; o.koszt+=s.koszt;
      if(s.zPlanu) o.zPlanu++;
      if(s.pobrana==null) o.pobranaOk=false; else o.zebrane+=s.zebraneJutro||0;
      Object.entries(s.zuz).forEach(([k,v])=>o.zuz[k]=(o.zuz[k]||0)+v);
    });
    o.obl=o.sztuki>0?o.planKg/o.sztuki:statRec(A.C,g.recepturaId).kg;   // obliczona skorygowana o wirt. sztuki
    o.pobrana=(o.pobranaOk&&o.sztuki>0)?(o.zadanaKg-o.zebrane)/o.sztuki:null;
    return o;
  });
}
function kosztKatGrupy(C,zuz){ const o={obj:0,tres:0,dod:0}; Object.entries(zuz).forEach(([s,kg])=>{ const k=C.sur[s]?.kat||'obj'; o[k]+=kg*(C.ceny[s]||0)/1000; }); return o; }

// Stan magazynowy: spis (stan po żywieniu w dniu spisu) + dostawy po spisie − zużycie z kolejnych dni
function stanSurowca(s,doDnia=dzis()){
  let t=s.stanBazT||0; const od=s.stanData||doDnia;
  (s.dostawy||[]).forEach(x=>{ if(x.data>od && x.data<=doDnia) t+=x.t||0; });
  // produkcja Suchego TMR: składniki schodzą, produkt przybywa (partie po dniu spisu)
  (D.suchytmr?.partie||[]).forEach(p=>{ if(p.data>od && p.data<=doDnia){ if(s.produkt==='stmr') t+=(p.kg||0)/1000; (p.sklad||[]).forEach(x=>{ if(x.s===s.id) t-=(x.kg||0)/1000; }); } });
  let d=dataPlus(od,1), n=0;
  while(d<=doDnia && n<DNI_STANY_MAX+5){ t-=(analizaDnia(d).zuz[s.id]||0)/1000; d=dataPlus(d,1); n++; }
  return t;
}
function procKlasa(p){ if(p==null||!Number.isFinite(p)) return ''; const r=Math.abs(p-100); return r<=3?'ok':r<=10?'sr':'zle'; }

        <input class="pole" style="width:210px" data-fid="sn_${s.id}" value="${esc(s.nazwa)}" onchange="ustawSur('${s.id}','nazwa',this.value)"></div></td>
      <td class="l"><span class="kat-kropka" style="background:${KAT_KOL[s.kat]}"></span><select class="pole" onchange="ustawSur('${s.id}','kat',this.value)">${Object.entries(KAT_KR).map(([k,t])=>`<option value="${k}" ${s.kat===k?'selected':''}>${t}</option>`).join('')}</select></td>
      <td>${jestProd?`<span title="Liczona automatycznie z najnowszej partii w zakładce Suchy TMR">${fmt(s.cenaT,2)} <span class="znacznik">z partii</span></span>`:`<input class="pole num" inputmode="decimal" data-fid="sc_${s.id}" value="${fmtIn(s.cenaT,2)}" onchange="ustawSur('${s.id}','cenaT',this.value)">`}</td>
      <td>${cenaKg(s.cenaT)}</td>
      <td><b class="${stan<0?'ostrz':''}">${fmt(stan,2)}</b><div class="cichy" style="font-size:11.5px">spis ${dataPL(s.stanData)}</div></td>
      <td data-wpis><button class="btn maly" onclick="modalSpis('${s.id}')">Spis</button></td>
      <td data-wpis>${jestProd?`<button class="btn maly" data-zawsze onclick="pokazZakladke('suchytmr')">Produkcja ›</button>`:`<button class="btn maly glowny" onclick="modalDostawa('${s.id}')">+ Dostawa</button>`} ${nDost?`<button class="btn maly" data-zawsze onclick="UI.rozwDost['${s.id}']=!UI.rozwDost['${s.id}'];render()">${rozw?'▾':'▸'} ${nDost}</button>`:''}</td>
      <td>${fmt(du,0)}${prod>0.5?`<div class="cichy" style="font-size:11.5px" title="średnio z produkcji Suchego TMR z ostatnich 30 dni">w tym suchy TMR ${fmt(prod,0)}</div>`:''}</td>
      <td class="l">${wyst}</td>
      <td><button class="btn ikona usun" onclick="usunSur('${s.id}')" aria-label="Usuń">✕</button></td></tr>`;
    if(rozw && nDost){
      h+=`<tr><td colspan="10" class="l" style="background:var(--pow2)"><table class="t" style="max-width:720px"><thead><tr><th class="l">Data dostawy</th><th>Ilość (t)</th><th class="l">Uwagi</th><th class="l">Wpływ na stan</th><th></th></tr></thead><tbody>
        ${[...s.dostawy].sort((a,b)=>b.data.localeCompare(a.data)).map(x=>`<tr><td class="l">${dataPL(x.data)}</td><td>${fmt(x.t,2)}</td><td class="l">${esc(x.uwagi||'')}</td>
        <td class="l">${x.data<=s.stanData?'<span class="cichy">przed spisem – już w stanie</span>':x.data>dzis()?'<span class="cichy">przyszła</span>':'doliczona'}</td>
        <td data-wpis><button class="btn ikona usun" onclick="usunDostawe('${s.id}','${x.id}')">✕</button></td></tr>`).join('')}</tbody></table></td></tr>`;
    }
    return h;
  }).join('');
  return `<div class="panel"><div class="ph"><h2>Surowce i stany magazynowe</h2>
      <span class="opis">Stan = spis + dostawy po spisie − zużycie z dawek zadanych (dni bez kursów wg planu) ± produkcja Suchego TMR</span>
      <div class="prawo"><button class="btn" data-zawsze onclick="drukujSurowce()">Drukuj</button><button class="btn glowny" onclick="modalNowySur()">+ Surowiec</button></div></div>
    <div class="przewin"><table class="t"><thead><tr><th class="l">Surowiec</th><th class="l">Kategoria</th><th>Cena zł/t</th><th>zł/kg</th><th>Stan (t)</th><th></th><th class="l">Dostawy</th><th>Zużycie<br>kg/dzień</th><th class="l">Wystarczy do</th><th></th></tr></thead>
    <tbody>${wiersze||'<tr><td colspan="10"><div class="pusto"><b>Brak surowców</b>Dodaj pierwszy surowiec przyciskiem „+ Surowiec”.</div></td></tr>'}</tbody></table></div></div>`;
};
function ustawSur(id,pole,v){
  const s=surowiec(id); if(!s) return;
  if(pole==='cenaT') s.cenaT=Math.max(0,liczba(v)); else if(pole==='nazwa'){ v=v.trim(); if(!v){ toast('Nazwa nie może być pusta','zly'); render(); return; } s.nazwa=v; } else s[pole]=v;
  saveModule('surowce'); render();
}
function przesunSur(id,dir){ const i=D.surowce.findIndex(s=>s.id===id), j=i+dir; if(i<0||j<0||j>=D.surowce.length) return; [D.surowce[i],D.surowce[j]]=[D.surowce[j],D.surowce[i]]; saveModule('surowce'); render(); }
function usunSur(id){
  const s=surowiec(id); const uzyte=D.receptury.filter(r=>r.sk.some(x=>x.s===id&&x.kg>0));
  if(uzyte.length){ toast(`„${s.nazwa}” jest w recepturach: ${uzyte.map(r=>r.nazwa).join(', ')}. Najpierw usuń go z dawek.`,'zly'); return; }
  if(D.suchytmr.receptura.some(x=>x.s===id)){ toast(`„${s.nazwa}” jest w recepturze Suchego TMR. Najpierw usuń go z tej receptury.`,'zly'); return; }
  if(s.produkt==='stmr' && D.suchytmr.partie.length){ toast('Suchy TMR ma historię produkcji – nie można go usunąć z bazy.','zly'); return; }
  if(!confirm(`Usunąć surowiec „${s.nazwa}” wraz z historią dostaw?`)) return;
  D.surowce=D.surowce.filter(x=>x.id!==id);
  let rz=false; D.receptury.forEach(r=>{ const n=r.sk.length; r.sk=r.sk.filter(x=>x.s!==id); r.kolejnosc=r.kolejnosc.filter(x=>x!==id); if(r.sk.length!==n) rz=true; });
  saveModule('surowce'); if(rz) saveModule('receptury'); render(); toast('Usunięto surowiec');
}
function modalNowySur(){
  modal('Nowy surowiec',`<div><label class="et">Nazwa</label><input class="pole szer" id="ns-n"></div>
    <div class="wiersz"><div><label class="et">Kategoria</label><select class="pole szer" id="ns-k">${Object.entries(KAT_KR).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></div>
    <div><label class="et">Cena (zł/t)</label><input class="pole szer" id="ns-c" inputmode="decimal"></div>
    <div><label class="et">Stan teraz (t)</label><input class="pole szer" id="ns-s" inputmode="decimal" value="0"></div></div>`,
  [{t:'Anuluj'},{t:'Dodaj surowiec',k:'glowny',f:()=>{
    const n=mv('ns-n').trim(); if(!n){ toast('Podaj nazwę surowca','zly'); return false; }
    D.surowce.push({id:uid('s'),nazwa:n,kat:mv('ns-k'),cenaT:Math.max(0,liczba(mv('ns-c'))),stanBazT:liczba(mv('ns-s')),stanData:dzis(),dostawy:[]});
    saveModule('surowce'); render(); toast('Dodano surowiec');
  }}]);
}
function modalSpis(id){
  const s=surowiec(id);
  modal('Spis z natury — '+esc(s.nazwa),`<p class="cichy" style="margin:0">Wpisz stan po żywieniu w dniu spisu. Od następnego dnia stan zmniejsza się o zużycie z dawek, a dostawy z późniejszą datą są doliczane.</p>
    <div class="wiersz"><div><label class="et">Stan (t)</label><input class="pole szer" id="sp-t" inputmode="decimal" value="${fmtIn(stanSurowca(s),2)}"></div>
    <div><label class="et">Data spisu</label><input class="pole szer" type="date" id="sp-d" value="${dzis()}" max="${dzis()}"></div></div>`,
  [{t:'Anuluj'},{t:'Zapisz spis',k:'glowny',f:()=>{
    const d=mv('sp-d')||dzis();
    if(d<dataPlus(dzis(),-DNI_STANY_MAX)){ toast('Spis może mieć najwyżej '+DNI_STANY_MAX+' dni','zly'); return false; }
    s.stanBazT=liczba(mv('sp-t')); s.stanData=d; if(s.produkt) s.spisRecznie=true; saveModule('surowce'); render(); toast('Zapisano spis: '+fmt(s.stanBazT,2)+' t');
  }}]);
}
function modalDostawa(id){
  const s=surowiec(id);
  modal('Dostawa — '+esc(s.nazwa),`<div class="wiersz"><div><label class="et">Ilość (t)</label><input class="pole szer" id="dv-t" inputmode="decimal" placeholder="np. 24,5"></div>
    <div><label class="et">Data dostawy</label><input class="pole szer" type="date" id="dv-d" value="${dzis()}"></div></div>
    <div><label class="et">Uwagi</label><input class="pole szer" id="dv-u" placeholder="nr faktury, dostawca"></div>
    <p class="cichy" style="margin:0">Dostawa z wcześniejszą datą jest liczona od tamtego dnia – zużycie od tej daty odejmie się samo. Dostawa sprzed ostatniego spisu (${dataPL(s.stanData)}) nie zmienia stanu.</p>`,
  [{t:'Anuluj'},{t:'Przyjmij dostawę',k:'glowny',f:()=>{
    const t=liczba(mv('dv-t')); if(t<=0){ toast('Podaj ilość dostawy w tonach','zly'); return false; }
    const d=mv('dv-d')||dzis();
    s.dostawy.push({id:uid('d'),data:d,t,uwagi:mv('dv-u').trim(),ts:Date.now()});
    saveModule('surowce'); render();
    toast(d<=s.stanData?'Zapisano – dostawa sprzed spisu, stan bez zmian':`Przyjęto ${fmt(t,2)} t → stan ${fmt(stanSurowca(s),2)} t`);
  }}]);
}
function usunDostawe(sid,did){ const s=surowiec(sid); if(!confirm('Usunąć wpis dostawy?')) return; s.dostawy=s.dostawy.filter(x=>x.id!==did); saveModule('surowce'); render(); }

/* =====================================================================
   10. ZAKŁADKA: DAWKI (receptury + grupy i sektory)
   ===================================================================== */
R.dawki=()=>{
  const C=kontekstBiezacy();
  const wRec=new Set(); D.receptury.forEach(r=>r.sk.forEach(x=>wRec.add(x.s)));
  const wiersze=D.surowce.filter(s=>wRec.has(s.id));
  const nr=UI.numerRec;
  const grupyRec=rid=>D.grupy.filter(g=>g.recepturaId===rid);
  const nag=D.receptury.map((r,i)=>{
    const st=statRec(C,r.id), kol=kolejnoscZaladunku(C,r.id), ileNr=kol.filter(x=>x.nr).length;
    return `<th class="rk ${nr===r.id?'numerowanie':''}" data-drop="rec" data-accept="rec" data-id="${r.id}">
      <div class="rk-gora"><button class="btn ikona" title="Przesuń kolumnę w lewo" ${i===0?'disabled':''} onclick="przesunRec('${r.id}',-1)">◀</button><span class="uchwyt" data-drag="rec" data-id="${r.id}" data-duch-tekst="${esc(r.nazwa)}" title="Przeciągnij, żeby przestawić kolumnę">⋮⋮</span><button class="btn ikona" title="Przesuń kolumnę w prawo" ${i===D.receptury.length-1?'disabled':''} onclick="przesunRec('${r.id}',1)">▶</button></div>
      <div class="rk-nazwa" onclick="if(!_poDrag)modalRec('${r.id}')" title="Zmień nazwę i uwagi">${esc(r.nazwa)}</div>
      <div class="rk-grupy">${grupyRec(r.id).map(g=>`<span style="background:${g.kolor}">${esc(g.nazwa)}</span>`).join('')||'<span style="background:#9aa39d">bez grupy</span>'}</div>
      <div class="rk-akcje"><button class="btn ikona" title="Kolejność załadunku" onclick="numeruj('${r.id}')">🔢 ${ileNr}/${kol.length}</button><button class="btn ikona" title="Duplikuj" onclick="duplikujRec('${r.id}')">⧉</button><button class="btn ikona usun" title="Usuń" onclick="usunRec('${r.id}')">✕</button></div></th>`;
  }).join('');
  const body=wiersze.map(s=>`<tr><td class="l"><div class="nazwa-sur"><span class="kat-kropka" style="background:${KAT_KOL[s.kat]}"></span>${esc(s.nazwa)} <span class="cichy">${cenaKg(s.cenaT)} zł/kg</span>
      <button class="btn ikona" style="margin-left:auto" title="Usuń wiersz ze wszystkich receptur" onclick="usunWierszRec('${s.id}')">✕</button></div></td>
    ${D.receptury.map(r=>{
      const x=r.sk.find(y=>y.s===s.id), kg=x?x.kg:0;
      if(nr===r.id){
        if(!(kg>0)) return `<td class="kom numerowanie"></td>`;
        const n=kolejnoscZaladunku(C,r.id).find(y=>y.s===s.id)?.nr;
        return `<td class="kom numerowanie" style="text-align:left"><button class="nr ${n?'ma':''}" onclick="klikNumer('${r.id}','${s.id}')" aria-label="Kolejność">${n||'+'}</button><span class="nr-kg">${fmt(kg,2,3)} kg</span></td>`;
      }
      const n=kg>0?(r.kolejnosc||[]).filter(id=>r.sk.some(y=>y.s===id&&y.kg>0)).indexOf(s.id)+1:0;
      return `<td class="kom">${n?`<span class="nr-mini">${n}</span>`:''}<input class="pole num" inputmode="decimal" data-fid="rk_${r.id}_${s.id}" value="${kg?fmtIn(kg,3):''}" placeholder="–" onchange="ustawKg('${r.id}','${s.id}',this.value)"></td>`;
    }).join('')}</tr>`).join('');
  const suma=k=>D.receptury.map(r=>{ const st=statRec(C,r.id); return `<td>${k(st)}</td>`; }).join('');
  let pasek='';
  if(nr && receptura(nr)){
    const r=receptura(nr);
    pasek=`<div class="pasek-num"><b>Kolejność załadunku: ${esc(r.nazwa)}</b><span>Klikaj surowce w kolejności wsypywania do wozu. Kliknięty numer usuwa się, a dalsze przesuwają.</span>
      <span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn maly" onclick="kolejnoscKategorie('${r.id}')">Objętościowe → treściwe → dodatki</button>
      <select class="pole" onchange="if(this.value)kopiujKolejnosc('${r.id}',this.value)"><option value="">Kopiuj z receptury…</option>${D.receptury.filter(x=>x.id!==r.id).map(x=>`<option value="${x.id}">${esc(x.nazwa)}</option>`).join('')}</select>
      <button class="btn maly" onclick="wyczyscKolejnosc('${r.id}')">Wyczyść</button><button class="btn maly" style="background:#fff;color:var(--gl)" onclick="UI.numerRec=null;render()">Gotowe</button></span></div>`;
  }
  return pasek+`<div class="panel"><div class="ph"><h2>Receptury</h2><span class="opis">kg świeżej masy na sztukę na dobę · liczba w rogu pola = kolejność załadunku · ◀ ▶ lub ⋮⋮ = kolejność kolumn</span>
      <div class="prawo"><button class="btn" onclick="modalWierszRec()">+ Surowiec do receptur</button><button class="btn glowny" onclick="nowaRec()">+ Receptura</button></div></div>
    <div class="przewin">${D.receptury.length?`<table class="t rec"><thead><tr><th class="l" style="min-width:260px;vertical-align:bottom">Surowiec</th>${nag}</tr></thead>
      <tbody>${body||`<tr><td colspan="${D.receptury.length+1}"><div class="pusto"><b>Receptury są puste</b>Dodaj surowce przyciskiem „+ Surowiec do receptur”.</div></td></tr>`}</tbody>
      <tfoot><tr class="suma"><td class="l">Dawka obliczona, kg/szt/dobę</td>${suma(st=>fmt(st.kg,2))}</tr>
      <tr class="pod"><td class="l">Koszt surowcowy, zł/szt/dobę</td>${suma(st=>fmt(st.koszt,2))}</tr>
      <tr class="pod"><td class="l">Koszt kg TMR, zł/kg</td>${suma(st=>fmt(st.kosztKg,3))}</tr></tfoot></table>`
      :'<div class="pusto"><b>Brak receptur</b>Utwórz pierwszą recepturę przyciskiem „+ Receptura”.</div>'}</div></div>`
  +R._grupy(C);
};
R._grupy=C=>{
  const lista=D.grupy.map((g,i)=>{
    const st=statRec(C,g.recepturaId), szt=g.sektory.reduce((a,s)=>a+(s.sztuki||0),0), ef=g.sektory.reduce((a,s)=>a+efSzt(s),0);
    return `<div class="grupa" data-drop="grp" data-accept="grp" data-id="${g.id}"><div class="kol" style="background:${g.kolor}" title="Zmień kolor" onclick="kolorGrupy('${g.id}')"></div><div class="tresc">
      <div><div class="g-gora"><span class="uchwyt" data-drag="grp" data-id="${g.id}" data-duch-tekst="${esc(g.nazwa)}" title="Przeciągnij, żeby przestawić grupę">⋮⋮</span><span class="strz"><button ${i===0?'disabled':''} onclick="przesunGrupe('${g.id}',-1)">▲</button><button ${i===D.grupy.length-1?'disabled':''} onclick="przesunGrupe('${g.id}',1)">▼</button></span>
        <input class="pole nazwa" data-fid="gn_${g.id}" value="${esc(g.nazwa)}" onchange="ustawGrupe('${g.id}','nazwa',this.value)">
        <input class="pole" style="width:110px" data-fid="go_${g.id}" value="${esc(g.opis||'')}" placeholder="opis" onchange="ustawGrupe('${g.id}','opis',this.value)">
        <button class="btn ikona usun" style="margin-left:auto" onclick="usunGrupe('${g.id}')">✕</button></div>
        <div class="g-gora" style="margin-top:8px"><select class="pole" style="flex:1" onchange="ustawGrupe('${g.id}','recepturaId',this.value)"><option value="">— receptura —</option>${D.receptury.map(r=>`<option value="${r.id}" ${g.recepturaId===r.id?'selected':''}>${esc(r.nazwa)}</option>`).join('')}</select></div>
        <div class="g-gora" style="margin-top:8px"><span class="przel" title="Ile razy dziennie zadawana – dawka dobowa dzieli się na tyle kursów">${[1,2].map(z=>`<button class="${(g.zadania||1)===z?'akt':''}" onclick="ustawGrupe('${g.id}','zadania',${z})">${z}× dziennie</button>`).join('')}</span>
          <label class="cichy" style="display:flex;gap:5px;align-items:center"><input type="checkbox" ${g.dojna?'checked':''} onchange="ustawGrupe('${g.id}','dojna',this.checked)"> krowy dojne</label></div></div>
      <div><label class="et">Sektory · sztuki realne · wirt. = na ile sztuk liczyć dawkę (puste = jak realne)</label><div class="sektory">${g.sektory.map(s=>`<span class="sektor-ed"><input class="pole" style="width:120px" data-fid="sen_${s.id}" value="${esc(s.nazwa)}" onchange="ustawSektor('${g.id}','${s.id}','nazwa',this.value)">
          <input class="pole krotkie num" inputmode="numeric" data-fid="ss_${s.id}" value="${s.sztuki}" onchange="ustawSektor('${g.id}','${s.id}','sztuki',this.value)"> szt
          <input class="pole krotkie num wirt" inputmode="numeric" data-fid="sw_${s.id}" value="${s.wirt??''}" placeholder="${s.sztuki}" title="Wirtualne sztuki – na ile sztuk liczyć dawkę tego sektora. Puste = tyle co realnych." onchange="ustawSektor('${g.id}','${s.id}','wirt',this.value)"> wirt.${s.wirt!=null&&s.sztuki>0?` <span class="znacznik" title="sektor dostaje ${fmt(s.wirt/s.sztuki*100,0)}% dawki liczonej na realne sztuki">${fmt(s.wirt/s.sztuki*100,0)}%</span>`:''}
          <button class="btn ikona usun" onclick="usunSektor('${g.id}','${s.id}')">✕</button></span>`).join('')}
          <button class="btn maly" onclick="dodajSektor('${g.id}')">+ Sektor</button></div>
        <label class="et" style="margin-top:8px">Uwagi do grupy (trafiają do raportu kosztów)</label><textarea class="pole" rows="1" data-fid="gu_${g.id}" onchange="ustawGrupe('${g.id}','uwagi',this.value)">${esc(g.uwagi||'')}</textarea></div>
      <div class="liczby-g"><span>Sztuk razem</span><b>${szt}${ef!==szt?` <span class="cichy" style="font-weight:600">· wirt. ${fmt(ef,0)}</span>`:''}</b><span>Dawka obliczona</span><b>${fmt(st.kg,1,2)} kg/szt</b>
        ${ef!==szt&&szt>0?`<span>Skorygowana</span><b>${fmt(st.kg*ef/szt,1,2)} kg/szt</b>`:''}
        <span>Plan na dobę</span><b>${fmt(st.kg*ef,0)} kg</b><span>Na jeden kurs</span><b>${fmt(st.kg*ef/(g.zadania||1),0)} kg</b>
        <span>Koszt</span><b>${fmt(szt>0?st.koszt*ef/szt:st.koszt,2)} zł/szt/d</b><span>Koszt grupy</span><b>${fmt(st.koszt*ef,0)} zł/d</b></div>
    </div></div>`;
  }).join('');
  const szt=D.grupy.reduce((a,g)=>a+g.sektory.reduce((b,s)=>b+(s.sztuki||0),0),0);
  return `<div class="panel"><div class="ph"><h2>Grupy żywieniowe i sektory</h2><span class="opis">${D.grupy.length} grup · ${szt} szt</span>
    <div class="prawo"><button class="btn glowny" onclick="nowaGrupa()">+ Grupa</button></div></div>${lista||'<div class="pusto"><b>Brak grup</b>Dodaj grupę, przypisz jej recepturę i sektory.</div>'}</div>`;
};
function ustawKg(rid,sid,v){
  const r=receptura(rid); const kg=Math.max(0,liczba(v));
  const x=r.sk.find(y=>y.s===sid); if(x) x.kg=kg; else r.sk.push({s:sid,kg});
  saveModule('receptury'); render();
}
function modalWierszRec(){
  const juz=new Set(); D.receptury.forEach(r=>r.sk.forEach(x=>juz.add(x.s)));
  const wolne=D.surowce.filter(s=>!juz.has(s.id));
  if(!D.receptury.length){ toast('Najpierw dodaj recepturę','zly'); return; }

function ustawSektor(gid,sid,pole,v){
  const s=grupa(gid).sektory.find(x=>x.id===sid); if(!s) return;
  if(pole==='sztuki'){ s.sztuki=Math.max(0,Math.round(liczba(v))); if(s.wirt!=null && s.wirt===s.sztuki) delete s.wirt; }
  else if(pole==='wirt'){
    const t=String(v).trim();
    if(t==='') delete s.wirt;
    else { const n=parseFloatPL(t); if(!Number.isFinite(n)||n<0){ toast('Wirtualne sztuki: wpisz liczbę albo zostaw puste','zly'); render(); return; }
      const r=Math.round(n); if(r===s.sztuki) delete s.wirt; else s.wirt=r; }
  }
  else { v=v.trim(); if(!v){ render(); return; } s.nazwa=v; }
  saveModule('grupy'); render();
}

function dzienDoEdycji(data){
  if(!DNI[data]) DNI[data]=normalizujDzien({},data);
  jednostkaDnia(data);
  // dziś i dni przyszłe: kopia zawsze aktualna – „zamarza” dopiero, gdy dzień minie
  if(!DNI[data].snap || data>=dzis()) DNI[data].snap={...klon(kontekstBiezacy()),ts:Date.now()};
  return DNI[data];
}
function kursyDnia(d,z){ return (d?.kursy||[]).filter(k=>k.zadanie===z); }
function numerKursu(d,kid){ const lista=[...kursyDnia(d,1),...kursyDnia(d,2)]; return lista.findIndex(k=>k.id===kid)+1; }
function alokacjeKursu(d,kid){ const o=[]; (d?.niedojady||[]).forEach(n=>n.alok.forEach((a,i)=>{ if(a.kursId===kid) o.push({n,a,i}); })); return o; }
function masaKursu(d,k){ const sw=k.rozdzial.reduce((a,r)=>a+(r.kg||0),0); const nd=alokacjeKursu(d,k.id).reduce((a,x)=>a+(x.a.kg||0),0); return {sw,nd,razem:sw+nd}; }
function woz(id){ return D.wozy.find(w=>w.id===id); }
function przypisaneSektora(d,sid,z){ return (d?.kursy||[]).filter(k=>z==null||k.zadanie===z).reduce((a,k)=>a+k.rozdzial.filter(r=>r.sektorId===sid).reduce((b,r)=>b+(r.kg||0),0),0); }

R.woz=()=>{

        ${sw&&sw.sztuki>0?`<br>pobrane ${dataPL(wczoraj).slice(0,5)}: <b>${fmt(sw.pobrana,1)}</b> kg/szt z zadanych ${fmt(sw.zadana,1)} (${g?esc(g.nazwa):''})`:''}

function kursHTML(d,C,A,k){
  const rec=C.receptury[k.recepturaId], st=statRec(C,k.recepturaId), m=masaKursu(d,k), w=woz(k.wozId), poj=w?.pojemnoscKg||0;

  const pas=kolory.length?(kolory.length===1?kolory[0]:`linear-gradient(90deg,${kolory.join(',')})`):'var(--linia)';
  // segmenty wanny w kolejności załadunku
  const licz={obj:0,tres:0,dod:0};
  const segs=st.kg>0?kolejnoscZaladunku(C,k.recepturaId).map((x,i)=>{
    const sk=st.sk.find(y=>y.s===x.s), kg=m.sw*sk.kg/st.kg, kat=C.sur[x.s]?.kat||'obj', kol=KAT_ODC[kat][licz[kat]++%3];

    return `<div class="seg" style="width:${pr}%;background:${kol}" title="${x.nr?x.nr+'. ':''}${esc(C.sur[x.s]?.nazwa)} – ${fmt(kg,0)} kg">${pr>3.2?(x.nr||'·'):''}</div>`;
  }).join(''):'';
  const segNd=m.nd>0?`<div class="seg nd" style="width:${m.nd/skala*100}%" title="Niedojady – ${fmt(m.nd,0)} kg">${m.nd/skala*100>4?'♻':''}</div>`:'';
  const przekr=poj>0&&m.razem>poj;
  const wiersze=k.rozdzial.map(r=>{
    const s=C.sektory[r.sektorId], g=s?C.grupy[s.grupaId]:null;
    const planK=planSek(C,r.sektorId)/(g?.zadania||1), p=planK>0?(r.kg||0)/planK*100:null;
    return `<div class="kw" data-drop="ndsek" data-accept="nd" data-kurs="${k.id}" data-sek="${r.sektorId}" data-swiezy="${k.id}_${r.sektorId}">

  }).join('');
  const ndW=alokacjeKursu(d,k.id).map(({n,a,i})=>{
    const zr=C.sektory[n.sektorId]||kontekst(dataPlus(d.data,-1)).sektory[n.sektorId], cel=C.sektory[a.sektorId];
    return `<div class="kw ndw" data-wpis data-swiezy="nd_${n.id}_${k.id}_${a.sektorId}"><span>♻</span><span>z ${esc(zr?.nazwa||'?')} → <b>${esc(cel?.nazwa||'?')}</b></span><span class="ukr"></span><span class="ukr"></span>

      <button class="btn ikona usun" onclick="usunAlok('${n.id}',${i})" aria-label="Usuń">✕</button></div>`;
  }).join('');
  return `<div class="kurs" data-drop="kurs" data-accept="sek nd kurs" data-id="${k.id}">
    <div class="kurs-pas" style="background:${pas}"></div>

/* Zmiana w Dawkach (sztuki, wirt. sztuki, receptura, sektory) przechodzi od razu na dziś i dni przyszłe:
   kg w kursach przeliczają się z zachowaniem % planu, a sektor usunięty albo z inną recepturą schodzi z kursu.
   Dni minione zostają zamrożone. r.plan = plan kg na kurs w chwili wpisu – punkt odniesienia proporcji. */
function przeliczDniPoDawkach(){
  const C=kontekstBiezacy(), dz=dzis(), zdjete=[]; let przeliczone=0;
  Object.keys(DNI).filter(x=>x>=dz).forEach(data=>{
    const d=DNI[data]; if(!d) return;
    const S=d.snap; let zm=false;
    d.kursy.forEach(k=>{
      const bylo=k.rozdzial.length;
      k.rozdzial=k.rozdzial.filter(r=>{
        const s=C.sektory[r.sektorId], g=s?C.grupy[s.grupaId]:null;
        if(!s || (k.recepturaId && g?.recepturaId!==k.recepturaId)){
          zm=true; zdjete.push(s?s.nazwa:(S?.sektory?.[r.sektorId]?.nazwa||'usunięty sektor'));
          d.niedojady.forEach(n=>n.alok=n.alok.filter(a=>!(a.kursId===k.id&&a.sektorId===r.sektorId)));
          return false;
        }
        const nowy=planSek(C,r.sektorId)/(g.zadania||1);
        let stary=r.plan;
        if(stary==null && S && S.sektory?.[r.sektorId]){ const gg=S.grupy?.[S.sektory[r.sektorId].grupaId]; stary=planSek(S,r.sektorId)/(gg?.zadania||1); }
        if(stary>0 && Math.abs(nowy-stary)>=0.5){ r.kg=Math.max(0,Math.round((r.kg||0)*nowy/stary)); zm=true; przeliczone++; }
        const pr=Math.round(nowy*100)/100; if(r.plan!==pr){ r.plan=pr; zm=true; }
        return true;
      });
      if(bylo && !k.rozdzial.length && k.recepturaId){ k.recepturaId=''; zm=true; }
    });
    const nowySnap=klon(C), stary=S?(({ts,...x})=>x)(S):null;
    if(!stary || stabilny(stary)!==stabilny(nowySnap)){ d.snap={...nowySnap,ts:Date.now()}; zm=true; }
    if(zm) saveDzien(data);
  });
  if(zdjete.length) setTimeout(()=>toast(`Zdjęto z kursów: ${[...new Set(zdjete)].join(', ')} (inna receptura albo usunięty sektor)`,'zly'),50);
  else if(przeliczone) setTimeout(()=>toast(`Przeliczono kg w kursach (${przeliczone}) – zachowany % planu`),50);
}

function dodajSektorDoKursu(kid,sid,bezZapisu){

  if(k.rozdzial.some(r=>r.sektorId===sid)){ odrzuc(kid); toast(`${s.nazwa} jest już w tym kursie`); return false; }
  k.recepturaId=g.recepturaId;

function przeniesKurs(kid,przedKid,z){

function ulozKursy(){
  const data=UI.data, ist=DNI[data];
  if(ist&&ist.kursy.length&&!confirm('Zastąpić kursy tego dnia planem? Domieszane niedojady zostaną odpięte od kursów.')) return;
  const d=dzienDoEdycji(data), C=kontekst(data), w=D.wozy[0], poj=w?.pojemnoscKg||0;
  const kursy=[]; let brakRec=[];
  [1,2].forEach(z=>{
    const kolej=[], per={};
    grupyC(C).forEach(g=>{
      if((g.zadania||1)<z) return;
      if(!g.recepturaId){ if(z===1) brakRec.push(g.nazwa); return; }
      sektoryGrupyC(C,g.id).forEach(s=>{
        const pk=planSek(C,s.id)/(g.zadania||1), kg=Math.round(pk); if(kg<=0) return;
        if(!per[g.recepturaId]){ per[g.recepturaId]=[]; kolej.push(g.recepturaId); }
        per[g.recepturaId].push({sektorId:s.id,kg,plan:Math.round(pk*100)/100});
      });
    });
    kolej.forEach(rid=>{
      let b=null, suma=0;
      per[rid].forEach(r=>{
        if(!b || (poj>0 && suma+r.kg>poj && b.rozdzial.length)){ b={id:uid('k'),wozId:w?.id||'',recepturaId:rid,zadanie:z,rozdzial:[]}; kursy.push(b); suma=0; }
        b.rozdzial.push(r); suma+=r.kg;

    });
  });

  saveDzien(data); render();

}

let drag=null;
document.addEventListener('pointerdown',e=>{
  if(e.button>0) return;

});
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!drag.start){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<6) return;
    drag.start=true;
    const zrodlo=drag.typ==='kurs'?drag.el.closest('.kurs'):drag.typ==='rec'?drag.el.closest('th'):drag.typ==='grp'?drag.el.closest('.grupa'):drag.el;

    else { duch=zrodlo.cloneNode(true); duch.style.width=Math.min(zrodlo.offsetWidth,320)+'px'; }
    duch.classList.add('duch');
    $$('input,select',duch).forEach(x=>x.disabled=true);
    document.body.appendChild(duch); drag.duch=duch; zrodlo.classList.add('przeciagany'); drag.zrodlo=zrodlo;
    document.body.style.userSelect='none';
  }
  e.preventDefault();
  drag.duch.style.left=(e.clientX-24)+'px'; drag.duch.style.top=(e.clientY-18)+'px';
  let t=document.elementFromPoint(e.clientX,e.clientY), cel=null;
  while(t && t!==document.body){ t=t.closest('[data-drop]'); if(!t) break; if(t.dataset.accept.split(' ').includes(drag.typ) && !(['kurs','rec','grp'].includes(drag.typ)&&t.dataset.id===drag.id)){ cel=t; break; } t=t.parentElement; }
  if(drag.cel!==cel){ drag.cel?.classList.remove('cel-ok'); cel?.classList.add('cel-ok'); drag.cel=cel; }
  const m=60; if(e.clientY<m) scrollBy(0,-14); else if(e.clientY>innerHeight-m) scrollBy(0,14);
},{passive:false});
function koniecDrag(e,anuluj){

    if(rodzaj==='kurs') przeniesKurs(id,cel.dataset.id);
    else if(rodzaj==='nowy') przeniesKurs(id,null,+cel.dataset.zad);
  } else if(typ==='rec' && rodzaj==='rec') przeniesRec(id,cel.dataset.id);
  else if(typ==='grp' && rodzaj==='grp') przeniesGrupe(id,cel.dataset.id);
}

   14. ZAKŁADKA: KOSZTY (struktura raportu kosztów żywienia)

function danePodstawy(data){ return UI.podstawa==='plan'?analizaDnia(data,{plan:true}):analizaDnia(data); }
function tabeleKosztow(data){
  const A=danePodstawy(data), C=A.C;
  const G=grupyDnia(A).filter(g=>g.sztuki>0);
  const zw=G.reduce((a,g)=>a+g.sztuki,0), dojne=G.filter(g=>g.dojna).reduce((a,g)=>a+g.sztuki,0);
  const surs=surowceKolejnosc(C).filter(s=>(A.zuz[s]||0)>0.0001);
  const katy=['obj','tres','dod'];
  const plan=g=>g.zPlanu?' *':'';
  const opisG=g=>`${esc(g.nazwa)}${g.opis?`<br><span style="font-weight:400">(${esc(g.opis)})</span>`:''}<br><span style="font-weight:400">${g.sztuki} szt${g.maWirt?` (wirt. ${fmt(g.efSzt,0)})`:''}${plan(g)}</span>`;
  // Sekcja 1
  let s1=`<table class="t"><thead><tr><th class="l">Surowiec (cena zł/kg)</th>${G.map(g=>`<th>${opisG(g)}</th>`).join('')}</tr></thead><tbody>`;
  katy.forEach(k=>{
    const ss=surs.filter(s=>C.sur[s]?.kat===k); if(!ss.length) return;
    s1+=ss.map(s=>`<tr><td class="l"><span class="kat-kropka" style="background:${KAT_KOL[k]}"></span>${esc(C.sur[s].nazwa)} <span class="cichy">(${cenaKg(C.ceny[s])})</span></td>${G.map(g=>{ const v=(g.zuz[s]||0)/g.sztuki; return `<td>${v>0.00001?fmt(v,2):'–'}</td>`; }).join('')}</tr>`).join('');
  });
  const maNd=G.some(g=>g.ndKg>0);
  if(maNd) s1+=`<tr><td class="l">♻ Niedojady domieszane</td>${G.map(g=>`<td>${g.ndKg>0?fmt(g.ndKg/g.sztuki,2):'–'}</td>`).join('')}</tr>`;
  s1+=`</tbody><tfoot><tr class="suma"><td class="l">SUMA kg TMR/szt</td>${G.map(g=>`<td>${fmt(g.zadanaKg/g.sztuki,1)}</td>`).join('')}</tr>
    <tr class="suma"><td class="l">KOSZT zł/szt/dzień</td>${G.map(g=>`<td>${fmt(g.koszt/g.sztuki,2)}</td>`).join('')}</tr>
    <tr class="pod"><td class="l">KOSZT zł/szt/miesiąc</td>${G.map(g=>`<td>${fmt(g.koszt/g.sztuki*MIESIAC_DNI,0)}</td>`).join('')}</tr></tfoot></table>`;
  // Sekcja 2
  const razem=Object.entries(A.zuz).reduce((a,[s,kg])=>a+kg*(C.ceny[s]||0)/1000,0);
  let s2=`<table class="t"><thead><tr><th class="l">Surowiec</th><th>Cena zł/kg</th><th>kg/dzień</th><th>kg/miesiąc</th><th>zł/dzień</th><th>zł/miesiąc</th><th>Udział</th></tr></thead><tbody>`;
  let kgR=0;
  katy.forEach(k=>{
    const ss=surs.filter(s=>C.sur[s]?.kat===k); if(!ss.length) return;
    let kgK=0,zlK=0;
    s2+=`<tr class="kat"><td colspan="7">${KAT[k].toUpperCase()}</td></tr>`+ss.map(s=>{ const kg=A.zuz[s], zl=kg*(C.ceny[s]||0)/1000; kgK+=kg; zlK+=zl;
      return `<tr><td class="l">${esc(C.sur[s].nazwa)}</td><td>${cenaKg(C.ceny[s])}</td><td>${fmt(kg,0)}</td><td>${fmt(kg*MIESIAC_DNI,0)}</td><td>${fmt(zl,2)}</td><td>${fmt(zl*MIESIAC_DNI,0)}</td><td>${fmt(razem>0?zl/razem*100:0,1)}%</td></tr>`; }).join('');
    kgR+=kgK;
    s2+=`<tr class="pod"><td class="l">Razem ${KAT[k].toLowerCase()}</td><td></td><td>${fmt(kgK,0)}</td><td>${fmt(kgK*MIESIAC_DNI,0)}</td><td>${fmt(zlK,2)}</td><td>${fmt(zlK*MIESIAC_DNI,0)}</td><td>${fmt(razem>0?zlK/razem*100:0,1)}%</td></tr>`;
  });
  s2+=`</tbody><tfoot><tr class="suma"><td class="l">RAZEM STADO</td><td></td><td>${fmt(kgR,0)}</td><td>${fmt(kgR*MIESIAC_DNI,0)}</td><td>${fmt(razem,2)}</td><td>${fmt(razem*MIESIAC_DNI,0)}</td><td>100%</td></tr></tfoot></table>`;
  // Sekcja 3
  const kosztG=G.reduce((a,g)=>a+g.koszt,0);
  let s3=`<table class="t"><thead><tr><th class="l">Grupa</th><th>Sztuk</th><th>kg TMR/szt</th><th>zł/szt/dzień</th><th>zł/grupa/dzień</th><th>zł/grupa/m-c</th><th>Udział</th></tr></thead><tbody>`+
    G.map(g=>`<tr><td class="l"><span class="kat-kropka" style="background:${g.kolor}"></span>${esc(g.nazwa)}${g.opis?' ('+esc(g.opis)+')':''}${plan(g)}</td><td>${g.sztuki}</td><td>${fmt(g.zadanaKg/g.sztuki,1)}</td><td>${fmt(g.koszt/g.sztuki,2)}</td><td>${fmt(g.koszt,2)}</td><td>${fmt(g.koszt*MIESIAC_DNI,0)}</td><td>${fmt(kosztG>0?g.koszt/kosztG*100:0,1)}%</td></tr>`).join('')+
    `</tbody><tfoot><tr class="suma"><td class="l">RAZEM STADO</td><td>${zw}</td><td></td><td></td><td>${fmt(kosztG,2)}</td><td>${fmt(kosztG*MIESIAC_DNI,0)}</td><td>100%</td></tr></tfoot></table>`;
  // Sekcja 4
  const sumK={obj:0,tres:0,dod:0};
  let s4=`<table class="t"><thead><tr><th class="l">Grupa</th><th>Sztuk</th><th>Objętościowe<br>zł/szt</th><th>Treściwe<br>zł/szt</th><th>Dodatki<br>zł/szt</th><th>RAZEM<br>zł/szt</th><th>Obj. %</th><th>Treść. %</th><th>Dod. %</th></tr></thead><tbody>`+
    G.map(g=>{ const kk=kosztKatGrupy(C,g.zuz), r=kk.obj+kk.tres+kk.dod; katy.forEach(k=>sumK[k]+=kk[k]); const p=k=>r>0?fmt(kk[k]/r*100,0)+'%':'–';
      return `<tr><td class="l">${esc(g.nazwa)}${g.opis?' ('+esc(g.opis)+')':''}</td><td>${g.sztuki}</td><td>${fmt(kk.obj/g.sztuki,2)}</td><td>${fmt(kk.tres/g.sztuki,2)}</td><td>${fmt(kk.dod/g.sztuki,2)}</td><td><b>${fmt(r/g.sztuki,2)}</b></td><td>${p('obj')}</td><td>${p('tres')}</td><td>${p('dod')}</td></tr>`; }).join('');
  const sr=sumK.obj+sumK.tres+sumK.dod, ps=k=>sr>0?fmt(sumK[k]/sr*100,0)+'%':'–';
  s4+=`</tbody><tfoot><tr class="suma"><td class="l">STADO zł/dzień</td><td>${zw}</td><td>${fmt(sumK.obj,2)}</td><td>${fmt(sumK.tres,2)}</td><td>${fmt(sumK.dod,2)}</td><td>${fmt(sr,2)}</td><td>${ps('obj')}</td><td>${ps('tres')}</td><td>${ps('dod')}</td></tr>
    <tr class="pod"><td class="l">STADO zł/miesiąc</td><td></td><td>${fmt(sumK.obj*MIESIAC_DNI,0)}</td><td>${fmt(sumK.tres*MIESIAC_DNI,0)}</td><td>${fmt(sumK.dod*MIESIAC_DNI,0)}</td><td>${fmt(sr*MIESIAC_DNI,0)}</td><td></td><td></td><td></td></tr></tfoot></table>`;
  // Uwagi
  const uw=[];
  if(G.some(g=>g.zPlanu)) uw.push('* Sektory bez kursów w tym dniu liczone wg dawki obliczonej (plan).');
  G.filter(g=>g.maWirt).forEach(g=>uw.push(`${esc(g.nazwa)}: dawka obliczona liczona na ${fmt(g.efSzt,0)} wirtualnych sztuk (${g.sztuki} realnych); koszt na sztukę liczony na realne sztuki.`));
  D.grupy.forEach(g=>{ if(g.uwagi&&G.some(x=>x.id===g.id)) uw.push(esc(g.nazwa)+': '+esc(g.uwagi)); });
  D.receptury.forEach(r=>{ if(r.uwagi&&G.some(g=>g.recepturaId===r.id)) uw.push(esc(r.nazwa)+': '+esc(r.uwagi)); });
  if(maNd) uw.push('Niedojady domieszane wliczone do kg TMR grupy docelowej; ich koszt poniosła grupa, z której pochodzą.');
  if(DNI[data]?.uwagi) uw.push(esc(DNI[data].uwagi));
  uw.push('Ceny netto. Miesiąc = '+MIESIAC_DNI+' dni.');
  return {A,G,zw,dojne,s1,s2,s3,s4,uw};
}
R.koszty=()=>{
  const data=UI.data, T=tabeleKosztow(data), u=D.ustawienia;

      ${UI.podstawa==='zadana'&&ileZPlanu?` · <span class="cichy">${ileZPlanu} ${ileZPlanu===1?'grupa':'grup'} bez kursów – liczone wg planu (*)</span>`:''}</div>

function tabelaRealizacji(data){
  const A=analizaDnia(data), G=grupyDnia(A).filter(g=>g.sztuki>0);
  const pc=(a,b)=>(a!=null&&b>0)?a/b*100:null;
  const kom=p=>p==null?'<td>–</td>':`<td><span class="proc ${procKlasa(p)}" style="display:inline-block;min-width:44px">${fmt(p,0)}%</span></td>`;
  const wiersz=(o,kl,et)=>`<tr class="${kl}"><td class="l">${et}</td><td>${o.sztuki}</td><td>${fmt(o.obl,1,2)}</td><td>${fmt(o.zadana,1,2)}</td>${kom(pc(o.zadana,o.obl))}
    <td>${o.ndKg>0?fmt(o.ndKg,0):'–'}</td><td>${o.zebr!=null?fmt(o.zebr,0):'–'}</td><td>${o.pobrana!=null?fmt(o.pobrana,1,2):'–'}</td>${kom(pc(o.pobrana,o.obl))}<td class="l">${o.zrodlo}</td></tr>`;
  const body=G.map(g=>{
    const go={sztuki:g.sztuki,obl:g.obl,zadana:g.zadanaKg/g.sztuki,ndKg:g.ndKg,zebr:g.pobranaOk?g.zebrane:null,pobrana:g.pobrana,zrodlo:g.zPlanu===g.sektory.length?'plan':g.zPlanu?'kursy + plan':'kursy'};
    return wiersz(go,'pod',`<span class="kat-kropka" style="background:${g.kolor}"></span><b>${esc(g.nazwa)}</b>${g.maWirt?` <span class="cichy">(wirt. ${fmt(g.efSzt,0)})</span>`:''}`)+
      (g.sektory.length>1?g.sektory.map(s=>wiersz({...s,zebr:s.pobrana!=null?(s.zebraneJutro||0):null,zrodlo:s.zPlanu?'plan':'kursy'},'','&nbsp;&nbsp;&nbsp;'+esc(s.nazwa)+(s.wirt!=null?` <span class="cichy">(wirt. ${s.wirt})</span>`:''))).join(''):'');
  }).join('');
  return `<table class="t"><thead><tr><th class="l">Grupa / sektor</th><th>Szt</th><th>Obliczona<br>kg/szt</th><th>Zadana<br>kg/szt</th><th>Zadana /<br>obliczona</th><th>♻ domieszane<br>kg</th><th>Niedojady<br>nast. dnia kg</th><th>Pobrana<br>kg/szt</th><th>Pobrana /<br>obliczona</th><th class="l">Źródło</th></tr></thead><tbody>${body}</tbody></table>`;
}
function tabelaZuzycia(od,doD){
  const sum={}, zl={}; let dniK=0, dniP=0, n=0;
  for(let d=od; d<=doD && n<400; d=dataPlus(d,1), n++){
    const A=analizaDnia(d); const C=A.C;
    if(A.d && A.d.kursy.length) dniK++; else dniP++;
    Object.entries(A.zuz).forEach(([s,kg])=>{ sum[s]=(sum[s]||0)+kg; zl[s]=(zl[s]||0)+kg*(C.ceny[s]||0)/1000; });
  }
  // produkcja Suchego TMR w okresie – składniki wliczone do zużycia
  let prodN=0, prodKg=0;
  (D.suchytmr?.partie||[]).forEach(p=>{ if(p.data>=od&&p.data<=doD){ prodN++; prodKg+=p.kg||0; (p.sklad||[]).forEach(x=>{ sum[x.s]=(sum[x.s]||0)+(x.kg||0); zl[x.s]=(zl[x.s]||0)+(x.kg||0)*(x.cenaT||0)/1000; }); } });
  const C=kontekstBiezacy(); let razem=0, rKg=0;
  const ss=surowceKolejnosc(C).filter(s=>sum[s]>0.001);
  let h=`<table class="t"><thead><tr><th class="l">Surowiec</th><th>kg</th><th>t</th><th>śr. kg/dzień</th><th>zł</th></tr></thead><tbody>`;
  ['obj','tres','dod'].forEach(k=>{
    const x=ss.filter(s=>C.sur[s]?.kat===k); if(!x.length) return;
    let kk=0,zz=0;
    h+=`<tr class="kat"><td colspan="5">${KAT[k]}</td></tr>`+x.map(s=>{ kk+=sum[s]; zz+=zl[s]; return `<tr><td class="l">${esc(C.sur[s].nazwa)}</td><td>${fmt(sum[s],0)}</td><td>${fmt(sum[s]/1000,2)}</td><td>${fmt(sum[s]/n,0)}</td><td>${fmt(zl[s],2)}</td></tr>`; }).join('');
    h+=`<tr class="pod"><td class="l">Razem</td><td>${fmt(kk,0)}</td><td>${fmt(kk/1000,2)}</td><td>${fmt(kk/n,0)}</td><td>${fmt(zz,2)}</td></tr>`; razem+=zz; rKg+=kk;
  });
  h+=`</tbody><tfoot><tr class="suma"><td class="l">RAZEM</td><td>${fmt(rKg,0)}</td><td>${fmt(rKg/1000,2)}</td><td>${fmt(rKg/Math.max(n,1),0)}</td><td>${fmt(razem,2)}</td></tr></tfoot></table>`;
  return {h,dniK,dniP,n,prodN,prodKg};
}

/* =====================================================================
   15a. ZAKŁADKA: SUCHY TMR (produkcja na fermie dla cieląt)
   Partia = zdarzenie z datą: zużywa składniki (zmniejsza ich stany) i dodaje Suchy TMR do stanu.
   Stany są wyliczane, więc usunięcie partii samo oddaje składniki na stan.
   ===================================================================== */
const ST=()=>D.suchytmr;
const produktStmr=()=>D.surowce.find(s=>s.produkt==='stmr');
function odm(n,a,b,c){ n=Math.abs(Math.round(n)); if(n===1) return a; const d=n%10, s=n%100; return (d>=2&&d<=4&&!(s>=12&&s<=14))?b:c; }
function sumaProcStmr(){ return ST().receptura.reduce((a,x)=>a+(+x.proc||0),0); }
function skladPartii(kg){ return ST().receptura.filter(x=>x.proc>0).map(x=>({s:x.s,proc:+x.proc,kg:Math.round(kg*x.proc/100*10)/10,cenaT:surowiec(x.s)?.cenaT||0})); }
function kosztSkladu(sklad){ return sklad.reduce((a,x)=>a+(x.kg||0)*(x.cenaT||0)/1000,0); }
function partieOdNajnowszej(){ return [...ST().partie].sort((a,b)=>b.data.localeCompare(a.data)||(b.ts||0)-(a.ts||0)); }
// średnie dzienne zużycie składnika na produkcję Suchego TMR z ostatnich dni – do „Zużycie kg/dzień” i „Wystarczy do”
function zuzycieProdukcjiDzienne(sid,dni=30){ const od=dataPlus(dzis(),-dni), dz=dzis(); let kg=0; (D.suchytmr?.partie||[]).forEach(p=>{ if(p.data>od&&p.data<=dz) (p.sklad||[]).forEach(x=>{ if(x.s===sid) kg+=x.kg||0; }); }); return kg/dni; }
function kgPartiiUI(){ return UI.stmrKg ?? ST().domyslnieKg ?? 3500; }

R.suchytmr=()=>{

  const sklad=skladPartii(kg), koszt=kosztSkladu(sklad), kosztT=kosztSkladu(skladPartii(1000));
  const ostatnia=partieOdNajnowszej()[0];
  const od30=dataPlus(dzis(),-30), p30=S.partie.filter(p=>p.data>od30&&p.data<=dzis()), kg30=p30.reduce((a,p)=>a+(p.kg||0),0);

  const prod=`<div class="panel" data-wpis><div class="ph"><h2>Produkcja partii</h2><span class="opis">po zatwierdzeniu składniki schodzą ze stanu, a Suchy TMR przybywa</span></div><div class="pb">
