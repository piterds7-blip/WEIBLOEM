      <div style="flex:0 0 auto"><label class="et">Szybki wybór</label><div class="szybkie">${[1000,2000,3500].map(v=>`<button class="btn ${kg===v?'glowny':''}" onclick="UI.stmrKg=${v};render()">${fmt(v,0)}</button>`).join('')}</div></div>
      <div style="flex:0 0 auto"><label class="et">Data produkcji</label><input type="date" class="pole" data-fid="stmr_data" value="${data}" max="${dzis()}" onchange="UI.stmrData=this.value||dzis();render()"></div>
    </div>
    ${sumaOk?'':`<div class="baner uwaga" style="margin:12px 0 0">Receptura sumuje się do ${fmt(suma,1)}% – popraw ją do 100%, żeby wyprodukować partię.</div>`}
    <div class="przewin" style="margin-top:12px"><table class="t"><thead><tr><th style="text-align:center">Kol.</th><th class="l">Składnik</th><th>Odważyć kg</th><th class="ukr-tel">Narastająco kg</th><th>Stan ${data===dzis()?'teraz':dataPL(data).slice(0,5)} t</th><th class="l"></th></tr></thead>

    <div class="cichy" style="margin-top:6px">Koszt surowcowy partii: <b>${fmt(koszt,2)} zł</b> · ${fmt(kg>0?koszt/kg*1000:0,0)} zł/t</div>

      <td style="white-space:nowrap"><input class="pole num krotkie" inputmode="decimal" data-fid="stp_${i}" value="${fmtIn(x.proc,2)}" onchange="ustawSkladnik(${i},'proc',this.value)"> %</td>
      <td class="ukr-tel">${fmt((+x.proc||0)*10,0)}</td><td class="ukr-tel">${cenaKg(s?.cenaT)}</td>
      <td style="white-space:nowrap"><span class="strz"><button ${i===0?'disabled':''} onclick="przesunSkladnik(${i},-1)" aria-label="Wyżej">▲</button><button ${i===S.receptura.length-1?'disabled':''} onclick="przesunSkladnik(${i},1)" aria-label="Niżej">▼</button></span><button class="btn ikona usun" onclick="usunSkladnik(${i})" aria-label="Usuń">✕</button></td></tr>`; }).join('');
  const recPanel=`<div class="panel"><div class="ph"><h2>Receptura na 1 tonę</h2><span class="opis">kolejność wierszy = kolejność wsypywania</span><div class="prawo"><button class="btn" onclick="dodajSkladnik()">+ Składnik</button></div></div>

function ustawSkladnik(i,pole,v){
  const x=ST().receptura[i]; if(!x) return;
  if(pole==='proc'){ const n=parseFloatPL(v); if(!Number.isFinite(n)||n<0){ toast('Wpisz procent, np. 13 albo 12,5','zly'); render(); return; } x.proc=Math.round(n*100)/100; }
  else { if(ST().receptura.some((y,j)=>j!==i&&y.s===v)){ toast('Ten surowiec już jest w recepturze','zly'); render(); return; } x.s=v; }
  saveModule('suchytmr'); render();
}
function dodajSkladnik(){
  const juz=new Set(ST().receptura.map(x=>x.s)), w=D.surowce.find(s=>!juz.has(s.id)&&s.produkt!=='stmr');
  if(!w){ toast('Wszystkie surowce z bazy są już w recepturze','zly'); return; }
  ST().receptura.push({s:w.id,proc:0}); saveModule('suchytmr'); render(); toast('Dodano wiersz – wybierz surowiec i wpisz %');
}
function usunSkladnik(i){ const x=ST().receptura[i]; if(!x) return; if(x.proc>0 && !confirm(`Usunąć „${surowiec(x.s)?.nazwa||'składnik'}” z receptury?`)) return; ST().receptura.splice(i,1); saveModule('suchytmr'); render(); }
function przesunSkladnik(i,dir){ const a=ST().receptura, j=i+dir; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; saveModule('suchytmr'); render(); }
// Suchy TMR jako surowiec w bazie – tworzony przy pierwszej partii
function zapewnijProduktStmr(odDnia){
  let p=produktStmr(); if(p) return p;
  if(poziom('surowce')<2) return null;
  p={id:surowiec('stmr')?uid('s'):'stmr',nazwa:'Suchy TMR',kat:'tres',cenaT:0,stanBazT:0,stanData:dataPlus(odDnia,-1),dostawy:[],produkt:'stmr'};
  D.surowce.push(p); return p;
}
// cena Suchego TMR w bazie = koszt surowcowy najnowszej partii (zł/t)
function aktualizujCeneStmr(){
  const P=produktStmr(); if(!P||poziom('surowce')<2) return false;
  const o=partieOdNajnowszej()[0]; if(!o||!(o.kg>0)) return false;
  const c=Math.round(kosztSkladu(o.sklad||[])/o.kg*1000);
  if(c===P.cenaT) return false; P.cenaT=c; return true;
}
function wyprodukujStmr(){
  const kg=kgPartiiUI(), data=UI.stmrData||dzis();
  if(!(kg>0)){ toast('Wpisz ilość większą od zera','zly'); return; }
  if(data>dzis()){ toast('Nie można zapisać produkcji z przyszłą datą','zly'); return; }
  if(Math.abs(sumaProcStmr()-100)>=0.01){ toast('Receptura musi sumować się do 100%','zly'); return; }
  const sklad=skladPartii(kg);
  if(!sklad.length || sklad.some(x=>!surowiec(x.s))){ toast('W recepturze jest surowiec, którego nie ma w bazie – wybierz go z listy','zly'); return; }
  const braki=sklad.filter(x=>stanSurowca(surowiec(x.s),data)*1000<x.kg).map(x=>surowiec(x.s).nazwa);
  if(!confirm(`Wyprodukować ${fmt(kg,0)} kg Suchego TMR (${dataPL(data)})?\n\nSkładniki zejdą ze stanu, Suchy TMR przybędzie.`+(braki.length?`\n\nUwaga – na stanie brakuje: ${braki.join(', ')}. Ich stan spadnie poniżej zera.`:''))) return;
  ST().partie.push({id:uid('p'),data,kg,sklad,ts:Date.now(),kto:PROFIL?.imie||PROFIL?.login||''});
  ST().domyslnieKg=kg;
  saveModule('suchytmr');
  const nowy=!produktStmr(), P=zapewnijProduktStmr(data); let zm=aktualizujCeneStmr();
  // bez ręcznego spisu Suchego TMR punkt startowy jego stanu cofa się do najwcześniejszej partii
  if(P && !P.spisRecznie && data<=P.stanData && poziom('surowce')>=2){ P.stanData=dataPlus(data,-1); zm=true; }
  if(P&&(nowy||zm)) saveModule('surowce');
  render();
  toast(P&&data<=P.stanData?`Zapisano partię ${fmt(kg,0)} kg – data sprzed spisu Suchego TMR, jego stan bez zmian`:`Wyprodukowano ${fmt(kg,0)} kg Suchego TMR – stany przeliczone`);
}
function usunPartie(pid){
  const p=ST().partie.find(x=>x.id===pid); if(!p) return;
  if(!confirm(`Usunąć partię z ${dataPL(p.data)} (${fmt(p.kg,0)} kg)?\nSkładniki wrócą na stan, a Suchy TMR zejdzie ze stanu.`)) return;
  ST().partie=ST().partie.filter(x=>x.id!==pid); saveModule('suchytmr');
  if(aktualizujCeneStmr()) saveModule('surowce');
  render(); toast('Usunięto partię – stany przeliczone');
}
function drukujKarteStmr(){
  const kg=kgPartiiUI(), data=UI.stmrData||dzis(), sklad=skladPartii(kg); let nar=0;
  if(!sklad.length){ toast('Receptura jest pusta','zly'); return; }

     <div class="uw">Najpierw słoma, potem melasa (klejenie), potem reszta. Koszt surowcowy partii: ${fmt(kosztSkladu(sklad),2)} zł (${fmt(kg>0?kosztSkladu(sklad)/kg*1000:0,0)} zł/t).</div>
     <div class="uw" style="margin-top:24px">Wyprodukował(a): ______________________ &nbsp;&nbsp; Data: ______________</div>`);
}

/* =====================================================================
   17a. ROLE I UPRAWNIENIA
   Poziomy: 0 brak (zakładka ukryta) · 1 podgląd · 2 wpis · 3 pełny.
   Macierz siedzi w Firestore (weibloem_admin/uprawnienia) i czytają ją też reguły
   bezpieczeństwa – to, czego rola nie może zapisać, odrzuci serwer, nie tylko interfejs.
   ===================================================================== */
const ROLE={tworca:{n:'Twórca',kol:'#24493A'},szef:{n:'Szef',kol:'#3D6FA3'},zootechnik:{n:'Zootechnik',kol:'#C0773A'},pracownik:{n:'Pracownik',kol:'#7A5BA6'}};
const POZIOMY=['brak','podgląd','wpis','pełny'];
// które poziomy mają sens w danej zakładce
const POZ_ZAKL={woz:[0,1,2,3],surowce:[0,1,2,3],dawki:[0,1,3],koszty:[0,1,3],raporty:[0,1],suchytmr:[0,1,2,3],cielaki:[0,1,3],ustawienia:[0,1,3],uzytkownicy:[0,1,3]};
const OPIS_WPISU={woz:'wpisujesz zadane kilogramy, niedojady i uwagi; układ kursów ustala zootechnik',surowce:'przyjmujesz dostawy i robisz spis; nazwy i ceny zmienia zootechnik',suchytmr:'wpisujesz produkcję Suchego TMR; recepturę zmienia zootechnik'};
const DOMYSLNE_UPR={
  szef:      {woz:3,dawki:3,surowce:3,koszty:3,raporty:1,suchytmr:3,cielaki:3,ustawienia:3,uzytkownicy:3},
  zootechnik:{woz:3,dawki:3,surowce:3,koszty:1,raporty:1,suchytmr:3,cielaki:3,ustawienia:1,uzytkownicy:0},
  pracownik: {woz:2,dawki:1,surowce:2,koszty:0,raporty:1,suchytmr:1,cielaki:1,ustawienia:0,uzytkownicy:0}
};
let PROFIL=null;     // {uid, login, imie, rola, aktywny}
let UPR=lsCzytaj('uprawnienia')||klon(DOMYSLNE_UPR);
let UZYT=[];         // lista kont (panel)
let auth=null;

function poziom(tab){
  if(!PROFIL) return 0;
  if(PROFIL.rola==='tworca') return 3;
  const v=UPR?.[PROFIL.rola]?.[tab];
  return typeof v==='number'?v:(DOMYSLNE_UPR[PROFIL.rola]?.[tab]??0);
}
function banerPoziomu(tab){
  const p=poziom(tab);
  if(p===1 && tab!=='raporty') return `<div class="baner tryb">Podgląd – w tej zakładce nie możesz nic zmieniać.</div>`;
  if(p===2 && OPIS_WPISU[tab]) return `<div class="baner tryb">Tryb wpisu: ${OPIS_WPISU[tab]}.</div>`;
  return '';
}
// Po narysowaniu zakładki blokuje to, czego rola nie może. data-zawsze = nawigacja/druk, data-wpis = dozwolone od poziomu „wpis”.
function zastosujPoziom(w,tab){
  const p=poziom(tab); if(p>=3) return;
  const wolno=el=>el.closest('[data-zawsze]') || (p===2 && el.closest('[data-wpis]'));
  $$('input,select,textarea,button',w).forEach(el=>{
    if(wolno(el)) return;
    el.disabled=true;
    if(el.tagName==='BUTTON') el.classList.add('ukryj-ro');
    if(el.tagName!=='BUTTON' && !el.value) el.placeholder='';
  });
  $$('[data-drag]',w).forEach(el=>{ if(!wolno(el)) el.removeAttribute('data-drag'); });
  $$('[onclick]',w).forEach(el=>{ if(el.tagName==='BUTTON'||wolno(el)) return; el.removeAttribute('onclick'); el.style.cursor='default'; });
  $$('.uchwyt',w).forEach(el=>{ if(!wolno(el)) el.style.visibility='hidden'; });
  if(tab==='woz') $$('.opis-boczny',w).slice(0,1).forEach(el=>el.style.display='none');
  $$('.upusc,.nowy-kurs',w).forEach(el=>{ if(!(p===2&&tab==='woz'&&el.classList.contains('upusc'))) el.style.display='none'; });
}

/* =====================================================================
   17b. LOGOWANIE (Firebase Authentication – hasła trzyma Firebase, aplikacja ich nie widzi)
   Login bez @ zamieniamy na adres techniczny login@weibloem.app; można też podać prawdziwy e-mail.
   ===================================================================== */
const DOMENA_LOGINU='weibloem.app';
const emailZLoginu=l=>{ l=l.trim().toLowerCase(); return l.includes('@')?l:l+'@'+DOMENA_LOGINU; };
const loginZEmaila=e=>(e||'').endsWith('@'+DOMENA_LOGINU)?e.slice(0,-(DOMENA_LOGINU.length+1)):e;
const jestEmail=l=>(l||'').includes('@') && !(l||'').endsWith('@'+DOMENA_LOGINU);
function bladAuth(e){
  const k=e&&e.code||'';
  return ({'auth/invalid-credential':'Nieprawidłowy login lub hasło.','auth/wrong-password':'Nieprawidłowy login lub hasło.','auth/user-not-found':'Nieprawidłowy login lub hasło.',
    'auth/invalid-login-credentials':'Nieprawidłowy login lub hasło.','auth/too-many-requests':'Za dużo prób. Odczekaj kilka minut i spróbuj ponownie.',
    'auth/network-request-failed':'Brak połączenia z internetem. Pierwsze logowanie na urządzeniu wymaga sieci.','auth/email-already-in-use':'Ten login jest już zajęty.',
    'auth/weak-password':'Hasło musi mieć co najmniej 6 znaków.','auth/invalid-email':'Login może zawierać litery, cyfry, kropkę, myślnik i podkreślenie.',
    'auth/operation-not-allowed':'Logowanie hasłem jest wyłączone. W konsoli Firebase włącz: Authentication → Sign-in method → Email/Password.',
    'auth/requires-recent-login':'Zaloguj się ponownie i powtórz zmianę hasła.'})[k]||('Błąd: '+(e&&e.message||k));
}
function pokazEkranLogowania(tryb,komunikat){
  $('header').hidden=true; $('#widok').hidden=true; const L=$('#logowanie'); L.hidden=false;
  const blad=komunikat?`<div class="login-blad">${esc(komunikat)}</div>`:'';
  let f='';
  if(tryb==='ladowanie') f=`<p class="cichy" style="text-align:center">Łączenie…</p>`;
  else if(tryb==='start') f=`<form onsubmit="event.preventDefault();utworzTworce()">
      <p class="cichy" style="margin:0">Pierwsze uruchomienie. Utwórz konto twórcy – będzie zarządzać pozostałymi kontami.</p>${blad}
      <div><label class="et">Imię i nazwisko</label><input class="pole szer" id="lg-i" autocomplete="name" required></div>
      <div><label class="et">Login</label><input class="pole szer" id="lg-l" autocomplete="username" autocapitalize="none" required></div>
      <div><label class="et">Hasło (min. 6 znaków)</label><input class="pole szer" id="lg-h" type="password" autocomplete="new-password" required></div>
      <div><label class="et">Powtórz hasło</label><input class="pole szer" id="lg-h2" type="password" autocomplete="new-password" required></div>
      <button class="btn glowny" id="lg-b">Utwórz konto twórcy</button></form>`;
  else f=`<form onsubmit="event.preventDefault();zaloguj()">${blad}
      <div><label class="et">Login</label><input class="pole szer" id="lg-l" autocomplete="username" autocapitalize="none" required></div>
      <div><label class="et">Hasło</label><input class="pole szer" id="lg-h" type="password" autocomplete="current-password" required></div>
      <button class="btn glowny" id="lg-b">Zaloguj</button>
      <p class="cichy" style="margin:0;text-align:center;font-size:13px">Nie pamiętasz hasła? Poproś szefa lub twórcę o nowe konto.</p></form>`;
  const lnk=(tryb==='logowanie'&&mozeInstalowac())?`<p style="margin:14px 0 0;text-align:center"><a href="#" onclick="instaluj();return false" style="color:var(--gl2);font-weight:600">Zainstaluj aplikację na telefonie</a></p>`:'';
  L.innerHTML=`<div class="login-karta"><img src="icon-192.png" alt=""><h1>Weibloem</h1><div class="pod-tyt">żywienie stada</div>${f}${lnk}</div>`;
  setTimeout(()=>{ const i=$('#lg-l')||$('#lg-i'); if(i) i.focus(); },50);
}
async function zaloguj(){
  const l=mv('lg-l'), h=mv('lg-h'), b=$('#lg-b'); b.disabled=true; b.textContent='Logowanie…';
  try{ await auth.signInWithEmailAndPassword(emailZLoginu(l),h); }
  catch(e){ pokazEkranLogowania('logowanie',bladAuth(e)); const i=$('#lg-l'); if(i) i.value=l; }
}
let tworzeTworce=false;
async function utworzTworce(){
  const i=mv('lg-i').trim(), l=mv('lg-l').trim(), h=mv('lg-h');
  if(h!==mv('lg-h2')) return pokazEkranLogowania('start','Hasła się różnią.');
  if(!jestEmail(l) && !/^[a-z0-9._-]{3,}$/i.test(l)) return pokazEkranLogowania('start','Login: min. 3 znaki – litery bez polskich znaków, cyfry, kropka, myślnik.');
  const b=$('#lg-b'); b.disabled=true; b.textContent='Tworzenie…';
  tworzeTworce=true;
  try{
    const c=await auth.createUserWithEmailAndPassword(emailZLoginu(l),h), uid=c.user.uid, t=Date.now();
    const bt=fs.batch();
    bt.set(fs.collection(KOL_UZYT).doc(uid),{login:l.toLowerCase(),imie:i,rola:'tworca',aktywny:true,utworzono:t,utworzyl:uid,ostatnio:t});
    bt.set(fs.collection(KOL_ADMIN).doc('init'),{ts:t,uid});
    await bt.commit();
    await fs.collection(KOL_ADMIN).doc('uprawnienia').set({m:DOMYSLNE_UPR,ts:t});
  }catch(e){ tworzeTworce=false; console.warn(e); try{ if(auth.currentUser) await auth.currentUser.delete(); }catch(x){} pokazEkranLogowania('start',bladAuth(e)); return; }
  tworzeTworce=false;
}

let aplikacjaWidoczna=false, profilNasluch=null, uzytNasluch=null;
function pokazAplikacje(){
  $('#logowanie').hidden=true; $('header').hidden=false; $('#widok').hidden=false;
  odswiezPrzyciskKonta();
  rysujZakladki(); render(); pokazSync();
  aplikacjaWidoczna=true;
  odswiezInstalacje();
}
function startAplikacji(){
  if(!FB_CONFIG || typeof firebase==='undefined' || !firebase.auth){
    PROFIL={rola:'tworca',imie:'',lokalny:true}; pokazAplikacje(); return;   // tryb lokalny – bez logowania
  }
  try{ if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG); fs=firebase.firestore(); auth=firebase.auth(); }
  catch(e){ console.warn('Firebase',e); syncBlad=true; PROFIL={rola:'tworca',lokalny:true}; pokazAplikacje(); return; }
  const zap=lsCzytaj('profil');
  if(!zap) pokazEkranLogowania('ladowanie');
  auth.onAuthStateChanged(async u=>{
    if(!u){
      PROFIL=null; localStorage.removeItem(LS+'profil');
      if(komunikatWylog){ pokazEkranLogowania('logowanie',komunikatWylog); komunikatWylog=null; return; }
      if(aplikacjaWidoczna){ location.reload(); return; }
      let init=true;
      try{ init=(await fs.collection(KOL_ADMIN).doc('init').get()).exists; }catch(e){ console.warn('init',e); }
      pokazEkranLogowania(init?'logowanie':'start'); return;
    }
    // Konto z pamięci (np. offline) – pokazujemy dane od razu, rola potwierdzi się z chmury
    if(zap && zap.uid===u.uid && zap.aktywny){ PROFIL=zap; pokazAplikacje(); startSync(); nasluchAdmin(); }
    if(profilNasluch) profilNasluch();
    let pierwszy=true;
    profilNasluch=fs.collection(KOL_UZYT).doc(u.uid).onSnapshot(s=>{
      if(!s.exists){ if(tworzeTworce) return; zablokujSesje('To konto nie ma przypisanej roli. Skontaktuj się z twórcą aplikacji.'); return; }
      const d=s.data();
      if(!d.aktywny){ zablokujSesje('Konto zostało zablokowane.'); return; }
      const zmianaRoli=PROFIL && PROFIL.rola!==d.rola;
      PROFIL={uid:u.uid,login:d.login||loginZEmaila(u.email),imie:d.imie||'',rola:d.rola,aktywny:true};
      lsZapisz('profil',PROFIL);
      if(!aplikacjaWidoczna){ pokazAplikacje(); startSync(); nasluchAdmin(); }
      else if(zmianaRoli){ toast('Twoja rola: '+ROLE[d.rola].n); pokazAplikacje(); nasluchAdmin(); }
      else odswiezPrzyciskKonta();
      if(pierwszy && !s.metadata.hasPendingWrites){ pierwszy=false; fs.collection(KOL_UZYT).doc(u.uid).update({ostatnio:Date.now()}).catch(()=>{}); }
    },e=>{ console.warn('profil',e); });
  });
}
let komunikatWylog=null;
async function zablokujSesje(tekst){
  komunikatWylog=tekst; aplikacjaWidoczna=false; PROFIL=null;
  localStorage.removeItem(LS+'profil');
  try{ await auth.signOut(); }catch(e){ pokazEkranLogowania('logowanie',tekst); }
}
let adminNasluch=false;
function nasluchAdmin(){
  if(!adminNasluch){
    adminNasluch=true;
    fs.collection(KOL_ADMIN).doc('uprawnienia').onSnapshot(s=>{
      if(s.exists){
        UPR=s.data().m||klon(DOMYSLNE_UPR); lsZapisz('uprawnienia',UPR);
        // nowa zakładka (np. Suchy TMR) – twórca dopisuje domyślne poziomy do macierzy w chmurze, żeby czytały je reguły
        const brak=Object.keys(DOMYSLNE_UPR).some(r=>Object.keys(DOMYSLNE_UPR[r]).some(k=>typeof UPR?.[r]?.[k]!=='number'));
        if(brak && PROFIL?.rola==='tworca'){ const m=klon(UPR)||{}; Object.keys(DOMYSLNE_UPR).forEach(r=>{ m[r]={...DOMYSLNE_UPR[r],...(m[r]||{})}; }); fs.collection(KOL_ADMIN).doc('uprawnienia').set({m,ts:Date.now()}).catch(e=>console.warn('uprawnienia',e)); }
      }
      else if(PROFIL?.rola==='tworca') fs.collection(KOL_ADMIN).doc('uprawnienia').set({m:DOMYSLNE_UPR,ts:Date.now()}).catch(()=>{});
      rysujZakladki(); odswiezZdalnie();
    },e=>console.warn('uprawnienia',e));
  }
  if(!uzytNasluch && poziom('uzytkownicy')>=1){
    uzytNasluch=fs.collection(KOL_UZYT).onSnapshot(q=>{ UZYT=q.docs.map(d=>({uid:d.id,...d.data()})); if(UI.tab==='uzytkownicy') odswiezZdalnie(); },e=>console.warn('uzytkownicy',e));
  }
}
async function wyloguj(){
  wypchnijOczekujace();
  await new Promise(r=>setTimeout(r,500));
  localStorage.removeItem(LS+'profil');
  await auth.signOut();   // onAuthStateChanged przeładuje stronę
}

/* --- moje konto: zmiana hasła, wylogowanie --- */
function modalKonto(){
  if(!PROFIL||PROFIL.lokalny) return;
  modal('Moje konto',`<div class="osoba"><span class="avatar" style="background:${ROLE[PROFIL.rola].kol}">${esc(inicjaly(PROFIL.imie||PROFIL.login))}</span>
      <div><b>${esc(PROFIL.imie||'')}</b><small>login: ${esc(PROFIL.login)} · ${ROLE[PROFIL.rola].n}</small></div></div>
    ${jestZainstalowana()?'':`<div><button class="btn" onclick="zamknijModal();instaluj()">Zainstaluj aplikację na telefonie</button></div>`}
    <div style="border-top:1px solid var(--linia);padding-top:12px"><label class="et">Zmiana hasła</label>
      <div class="wiersz"><div><input class="pole szer" id="mk-s" type="password" placeholder="obecne hasło" autocomplete="current-password"></div>
      <div><input class="pole szer" id="mk-n" type="password" placeholder="nowe hasło (min. 6)" autocomplete="new-password"></div></div></div>`,
  [{t:'Wyloguj',k:'usun',f:()=>{ wyloguj(); }},{t:'Zamknij'},{t:'Zmień hasło',k:'glowny',f:()=>{ zmienHaslo(); return false; }}]);
}
async function zmienHaslo(){
  const s=mv('mk-s'), n=mv('mk-n');
  if(n.length<6){ toast('Nowe hasło musi mieć co najmniej 6 znaków','zly'); return; }
  try{
    const u=auth.currentUser;
    await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,s));
    await u.updatePassword(n);
    zamknijModal(); toast('Hasło zmienione');
  }catch(e){ toast(bladAuth(e),'zly'); }
}
const inicjaly=t=>String(t||'?').trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();

/* =====================================================================
   17c. ZAKŁADKA: UŻYTKOWNICY
   ===================================================================== */
function mogeZarzadzac(u){
  if(!PROFIL||PROFIL.lokalny||!u||u.uid===PROFIL.uid||u.rola==='tworca') return false;
  if(PROFIL.rola==='tworca') return true;
  return poziom('uzytkownicy')>=3 && ['zootechnik','pracownik'].includes(u.rola);
}
function roleDoNadania(){ return PROFIL?.rola==='tworca'?['szef','zootechnik','pracownik']:['zootechnik','pracownik']; }
R.uzytkownicy=()=>{
  if(!PROFIL||PROFIL.lokalny) return `<div class="panel"><div class="pusto"><b>Konta działają po podłączeniu Firebase</b>Wpisz konfigurację w pliku firebase-config.js i włącz logowanie e-mail/hasło w konsoli Firebase.</div></div>`;
  const kol=['tworca','szef','zootechnik','pracownik'];
  const lista=[...UZYT].sort((a,b)=>kol.indexOf(a.rola)-kol.indexOf(b.rola)||(a.imie||'').localeCompare(b.imie||'','pl'));
  const wiersze=lista.map(u=>{
    const moge=mogeZarzadzac(u), r=ROLE[u.rola]||{n:u.rola,kol:'#888'};
    const rola=moge?`<select class="pole" onchange="ustawKonto('${u.uid}','rola',this.value)">${roleDoNadania().map(x=>`<option value="${x}" ${u.rola===x?'selected':''}>${ROLE[x].n}</option>`).join('')}</select>`
                   :`<span class="rola-zn" style="background:${r.kol}">${r.n}</span>`;
    return `<tr${u.aktywny?'':' style="opacity:.6"'}><td class="l"><div class="osoba"><span class="avatar" style="background:${r.kol}">${esc(inicjaly(u.imie||u.login))}</span>
        <div><b>${esc(u.imie||'—')}</b>${u.uid===PROFIL.uid?' <span class="znacznik">to Ty</span>':''}<small>login: ${esc(u.login||'')}</small></div></div></td>
      <td class="l">${rola}</td>
      <td class="l"><span class="status ${u.aktywny?'on':'off'}">${u.aktywny?'aktywne':'zablokowane'}</span></td>
      <td class="l cichy">${u.ostatnio?new Date(u.ostatnio).toLocaleString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'jeszcze nie logował(a) się'}</td>
      <td class="l">${moge?`<button class="btn maly ${u.aktywny?'usun':''}" onclick="ustawKonto('${u.uid}','aktywny',${!u.aktywny})">${u.aktywny?'Zablokuj':'Odblokuj'}</button>
        ${jestEmail(u.login)?` <button class="btn maly" onclick="wyslijReset('${esc(u.login)}')">Wyślij link do zmiany hasła</button>`:''}`:''}</td></tr>`;
  }).join('');
  const twor=PROFIL.rola==='tworca';
  const macierz=ZAKLADKI.map(([k,t])=>`<tr><td class="l"><b>${t}</b></td><td><span class="lv lv3" style="display:inline-block;border-radius:14px;padding:4px 10px;font-weight:700;font-size:13px">pełny</span></td>
    ${['szef','zootechnik','pracownik'].map(r=>{ const v=UPR?.[r]?.[k]??DOMYSLNE_UPR[r]?.[k]??0;
      return `<td><select class="lv lv${v}" ${twor?'':'disabled'} onchange="ustawUpr('${r}','${k}',this.value)">${POZ_ZAKL[k].map(x=>`<option value="${x}" ${x===v?'selected':''}>${POZIOMY[x]}</option>`).join('')}</select></td>`; }).join('')}</tr>`).join('');
  return `<div class="panel"><div class="ph"><h2>Konta</h2><span class="opis">${UZYT.filter(u=>u.aktywny).length} aktywnych</span>
      <div class="prawo"><button class="btn glowny" onclick="modalNoweKonto()">+ Dodaj osobę</button></div></div>
    <div class="przewin"><table class="t"><thead><tr><th class="l">Osoba</th><th class="l">Rola</th><th class="l">Status</th><th class="l">Ostatnie logowanie</th><th></th></tr></thead><tbody>${wiersze||'<tr><td colspan="5"><div class="pusto">Ładowanie listy kont…</div></td></tr>'}</tbody></table></div>
    <div class="pb cichy" style="border-top:1px solid var(--linia)">Hasła przechowuje Firebase – nikt ich tu nie widzi, także twórca. Każdy zmienia swoje hasło w „Moje konto” (przycisk z imieniem u góry).
      Gdy ktoś zapomni hasła: zablokuj jego konto i załóż nowe z innym loginem. Jeśli login jest adresem e-mail, wystarczy wysłać link do zmiany hasła.</div></div>
  <div class="panel"><div class="ph"><h2>Co może każda rola</h2><span class="opis">${twor?'zmiana działa od razu na wszystkich urządzeniach':'zmieniać może tylko twórca'}</span></div>
    <div class="przewin"><table class="t upr" style="max-width:820px"><thead><tr><th class="l">Zakładka</th>${['tworca','szef','zootechnik','pracownik'].map(r=>`<th><span class="rola-zn" style="background:${ROLE[r].kol}">${ROLE[r].n}</span></th>`).join('')}</tr></thead><tbody>${macierz}</tbody></table></div>
    <div class="pb cichy" style="border-top:1px solid var(--linia)"><b>brak</b> – zakładka ukryta · <b>podgląd</b> – tylko odczyt · <b>wpis</b> – Wóz: kilogramy i niedojady, Surowce: dostawy i spis · <b>pełny</b> – wszystko.
      Twórca ma zawsze pełny dostęp, żeby nie dało się zablokować aplikacji.</div></div>`;
};
async function ustawKonto(uid,pole,v){
  const u=UZYT.find(x=>x.uid===uid); if(!mogeZarzadzac(u)) return;
  if(pole==='aktywny' && !v && !confirm(`Zablokować konto ${u.imie||u.login}? Ta osoba zostanie wylogowana na wszystkich urządzeniach.`)) return;
  try{ await fs.collection(KOL_UZYT).doc(uid).update({[pole]:v,zmienil:PROFIL.uid,zmieniono:Date.now()}); toast(pole==='rola'?'Zmieniono rolę na: '+ROLE[v].n:(v?'Konto odblokowane':'Konto zablokowane')); }
  catch(e){ toast('Nie udało się zapisać: '+(e.code==='permission-denied'?'brak uprawnień':e.message),'zly'); render(); }
}
async function ustawUpr(rola,tab,v){
  if(PROFIL?.rola!=='tworca') return;
  UPR=klon(UPR); UPR[rola]=UPR[rola]||{}; UPR[rola][tab]=+v;
  try{ await fs.collection(KOL_ADMIN).doc('uprawnienia').set({m:UPR,ts:Date.now()}); toast(`${ROLE[rola].n} – ${ZAKLADKI.find(z=>z[0]===tab)[1]}: ${POZIOMY[+v]}`); }
  catch(e){ toast('Nie udało się zapisać uprawnień','zly'); }
  render();
}
function losujHaslo(){ const z='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; const a=new Uint32Array(8); crypto.getRandomValues(a); a.forEach(x=>s+=z[x%z.length]); return s; }
function modalNoweKonto(){
  modal('Nowa osoba',`<div><label class="et">Imię i nazwisko</label><input class="pole szer" id="nk-i"></div>
    <div class="wiersz"><div><label class="et">Login</label><input class="pole szer" id="nk-l" autocapitalize="none" placeholder="np. jkowalski"></div>
      <div><label class="et">Rola</label><select class="pole szer" id="nk-r">${roleDoNadania().map(r=>`<option value="${r}" ${r==='pracownik'?'selected':''}>${ROLE[r].n}</option>`).join('')}</select></div></div>
    <div><label class="et">Hasło startowe</label><div style="display:flex;gap:6px"><input class="pole szer" id="nk-h" value="${losujHaslo()}"><button class="btn" onclick="$('#nk-h').value=losujHaslo()">Losuj</button></div></div>
    <p class="cichy" style="margin:0;font-size:13px">Login: litery bez polskich znaków, cyfry, kropka lub myślnik. Możesz też wpisać adres e-mail – wtedy zadziała wysyłanie linku do zmiany hasła.</p>`,
  [{t:'Anuluj'},{t:'Utwórz konto',k:'glowny',f:()=>{ utworzKonto(); return false; }}]);
}
async function utworzKonto(){
  const imie=mv('nk-i').trim(), login=mv('nk-l').trim().toLowerCase(), rola=mv('nk-r'), haslo=mv('nk-h');
  if(!imie){ toast('Podaj imię i nazwisko','zly'); return; }
  if(!jestEmail(login) && !/^[a-z0-9._-]{3,}$/.test(login)){ toast('Login: min. 3 znaki – litery bez polskich znaków, cyfry, kropka, myślnik','zly'); return; }
  if(haslo.length<6){ toast('Hasło musi mieć co najmniej 6 znaków','zly'); return; }
  if(!roleDoNadania().includes(rola)) return;
  const btn=$$('#modal .m-stopka .btn').pop(); if(btn){ btn.disabled=true; btn.textContent='Tworzenie…'; }
  try{
    // drugie wystąpienie Firebase – utworzenie konta nie wylogowuje osoby, która je zakłada
    const app2=firebase.apps.find(a=>a.name==='tworzenie')||firebase.initializeApp(FB_CONFIG,'tworzenie');
    const a2=app2.auth(); await a2.setPersistence(firebase.auth.Auth.Persistence.NONE);
    const c=await a2.createUserWithEmailAndPassword(emailZLoginu(login),haslo);
    const uid=c.user.uid; await a2.signOut();
    await fs.collection(KOL_UZYT).doc(uid).set({login,imie,rola,aktywny:true,utworzono:Date.now(),utworzyl:PROFIL.uid,ostatnio:null});
    window._noweHaslo=haslo;
    modal('Konto utworzone',`<p style="margin:0">Przekaż te dane osobie <b>${esc(imie)}</b> (${ROLE[rola].n}). Hasła nie da się później odczytać – zapisz je teraz.</p>
      <div class="haslo-pokaz">login: ${esc(login)}<br>hasło: ${esc(haslo)}</div><p class="cichy" style="margin:0;font-size:13px">Po pierwszym logowaniu warto zmienić hasło w „Moje konto”.</p>`,
      [{t:'Kopiuj dane',f:()=>{ navigator.clipboard?.writeText(`Weibloem\nadres: ${location.href.split('#')[0]}\nlogin: ${login}\nhasło: ${window._noweHaslo}`).then(()=>toast('Skopiowano')); return false; }},{t:'Gotowe',k:'glowny'}]);
  }catch(e){ console.warn(e); toast(e.code==='permission-denied'?'Brak uprawnień do zakładania kont tej roli':bladAuth(e),'zly'); if(btn){ btn.disabled=false; btn.textContent='Utwórz konto'; } }
}
async function wyslijReset(email){
  try{ await auth.sendPasswordResetEmail(email); toast('Wysłano link do zmiany hasła na '+email); }
  catch(e){ toast(bladAuth(e),'zly'); }
}


/* =====================================================================
   17d. INSTALACJA JAKO APLIKACJA (PWA) – przycisk, baner, instrukcje
   ===================================================================== */
let zdarzenieInstalacji=null;
const jestZainstalowana=()=>matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
const jestIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const jestTelefonem=()=>matchMedia('(pointer: coarse)').matches && Math.min(screen.width,screen.height)<900;
function mozeInstalowac(){ return !jestZainstalowana() && (!!zdarzenieInstalacji || jestIOS() || jestTelefonem()); }
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); zdarzenieInstalacji=e; odswiezInstalacje(); });
addEventListener('appinstalled',()=>{ zdarzenieInstalacji=null; localStorage.setItem('wb_instal_ukryty','1'); odswiezInstalacje(); toast('Aplikacja zainstalowana – znajdziesz ją na ekranie głównym'); });
function odswiezInstalacje(){
  const b=$('#instal'); if(!b) return;
  const pokaz=mozeInstalowac() && !localStorage.getItem('wb_instal_ukryty') && !$('#widok').hidden;
  b.hidden=!pokaz;
  if(pokaz) b.innerHTML=`<div class="instal-w"><img src="icon-192.png" alt=""><div class="instal-t"><b>Zainstaluj Weibloem na telefonie</b><span>Ikona na ekranie głównym, pełny ekran, szybszy start.</span></div>
    <button class="btn glowny" onclick="instaluj()">Zainstaluj</button><button class="btn" onclick="ukryjBaner()" aria-label="Nie teraz">Nie teraz</button></div>`;
  if(UI.tab==='ustawienia' && typeof render==='function' && !$('#modal').classList.contains('otw')) render();
}
function ukryjBaner(){ localStorage.setItem('wb_instal_ukryty','1'); $('#instal').hidden=true; }
function instaluj(){
  if(jestZainstalowana()){ toast('Aplikacja jest już zainstalowana na tym urządzeniu'); return; }
  if(zdarzenieInstalacji){
    const z=zdarzenieInstalacji; z.prompt();
    Promise.resolve(z.userChoice).then(w=>{ if(w&&w.outcome==='accepted') localStorage.setItem('wb_instal_ukryty','1'); }).finally(()=>{ zdarzenieInstalacji=null; odswiezInstalacje(); });
    return;
  }
  modalInstalacja();
}
function modalInstalacja(){
  const ios=jestIOS();
  const kroki={
    ios:['Otwórz tę stronę w przeglądarce <b>Safari</b> (nie w Chrome).','Stuknij przycisk <b>Udostępnij</b> (kwadrat ze strzałką w górę, na dole ekranu).','Przewiń listę i wybierz <b>Do ekranu początkowego</b>.','Stuknij <b>Dodaj</b>. Ikona Weibloem pojawi się na ekranie głównym.'],
    android:['Stuknij menu przeglądarki <b>⋮</b> (trzy kropki, prawy górny róg).','Wybierz <b>Zainstaluj aplikację</b> albo <b>Dodaj do ekranu głównego</b>.','Potwierdź przyciskiem <b>Zainstaluj</b>. Ikona Weibloem pojawi się na ekranie głównym.'],
    pc:['W pasku adresu Chrome lub Edge kliknij ikonę <b>instalacji</b> (monitor ze strzałką, po prawej).','Albo menu <b>⋮</b> → <b>Zapisz i udostępnij</b> → <b>Zainstaluj stronę jako aplikację</b>.']};
  const lista=k=>`<ol style="margin:6px 0 0;padding-left:20px;display:grid;gap:5px">${kroki[k].map(x=>`<li>${x}</li>`).join('')}</ol>`;
  const glowny=ios?'ios':(jestTelefonem()?'android':'pc');
  const inne=['ios','android','pc'].filter(x=>x!==glowny).map(x=>`<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">${{ios:'iPhone / iPad (Safari)',android:'Telefon z Androidem (Chrome)',pc:'Komputer (Chrome, Edge)'}[x]}</summary>${lista(x)}</details>`).join('');
  modal('Instalacja aplikacji',`<p style="margin:0">Aplikacja zainstaluje się bez sklepu – jak zwykła apka, z własną ikoną i bez paska przeglądarki.</p>
    <div><b>${{ios:'iPhone / iPad (Safari)',android:'Telefon z Androidem (Chrome)',pc:'Komputer (Chrome, Edge)'}[glowny]}</b>${lista(glowny)}</div>${inne}
    <p class="cichy" style="margin:0;font-size:13px">Dane synchronizują się z chmurą, więc po instalacji logujesz się tym samym loginem i hasłem.</p>`,[{t:'Zamknij',k:'glowny'}]);
}
function panelInstalacji(){
  const stan=jestZainstalowana()?'<span class="status on">zainstalowana na tym urządzeniu</span>':(zdarzenieInstalacji?'<span class="status on">gotowa do instalacji</span>':'<span class="znacznik">instalacja ręczna</span>');
  return `<div class="panel"><div class="ph"><h2>Aplikacja na telefonie</h2>${stan}</div><div class="pb">
    <p style="margin:0 0 10px">Zainstaluj Weibloem na ekranie głównym telefonu lub komputera – otwiera się na pełnym ekranie, jak zwykła aplikacja.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn glowny" data-zawsze onclick="instaluj()">${jestZainstalowana()?'Jak zainstalować na innym urządzeniu':'Zainstaluj aplikację'}</button>
    <button class="btn" data-zawsze onclick="modalInstalacja()">Instrukcja krok po kroku</button>
    ${localStorage.getItem('wb_instal_ukryty')?'<button class="btn" data-zawsze onclick="localStorage.removeItem(\'wb_instal_ukryty\');odswiezInstalacje()">Pokaż baner instalacji</button>':''}</div></div></div>`;
}
function odswiezPrzyciskKonta(){
  const k=$('#konto'); if(!k) return;
  if(!PROFIL||PROFIL.lokalny){ k.hidden=true; return; }
  k.hidden=false; k.innerHTML=`<span class="k-imie">${esc(PROFIL.imie||PROFIL.login)}</span><span class="k-rola"> · ${ROLE[PROFIL.rola].n}</span>`;
}

/* =====================================================================
   18. START: najpierw localStorage, potem Firestore
   ===================================================================== */
inicjujDane();                 // 1. dane z localStorage – szybki start, działa offline
startAplikacji();              // 2. logowanie (jeśli jest Firebase) → widok → nasłuch Firestore
if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW',e));
</script>
